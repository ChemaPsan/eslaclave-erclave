[project]
name = "erclave-backend"
version = "0.1.0"
description = "ERClave backend MVP scaffolding"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.0,<3.0",
  "firebase-admin>=6.5,<7.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0"
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["shared"]
include = ["erclave_common*"]

[tool.pytest.ini_options]
pythonpath = [
  "shared",
  "services/admin-service",
  "services/production-service",
  "services/inventory-service",
  "services/hr-service"
]
testpaths = [
  "services/admin-service/tests",
  "services/production-service/tests",
  "services/inventory-service/tests",
  "services/hr-service/tests"
]
