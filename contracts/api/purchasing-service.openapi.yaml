      - $ref: '#/components/schemas/PurchaseOrderWrite'
      - type: object
        required:
        - code
      description: Conserva el folio. Si code_mode es managed, el codigo enviado debe ser igual al persistido.
    ReceiptLine:
      type: object
      required:
      - order_line_id
      - quantity
      properties:
        order_line_id:
          type: string
        quantity:
          type: number
          exclusiveMinimum: 0
        warehouse_id:
          type:
          - string
          - 'null'
          description: Obligatorio para articulos inventariables y prohibido para servicios; una recepcion de servicio es comercial y no genera
            movimiento de Inventory.
    ReceiptWrite:
      properties:
        code:
          anyOf:
          - type: string
            maxLength: 60
            minLength: 1
          - type: 'null'
          title: Code
          description: Obligatorio solo en modo manual; Admin asigna el folio administrado.
        purchase_order_id:
          type: string
          title: Purchase Order Id
        received_at:
          type: string
          format: date-time
          title: Received At
        supplier_document_reference:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Supplier Document Reference
        cost_exchange_rate:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,12}|(?=[\d.]{1,19}0*$)\d{0,12}\.\d{0,6}0*$)
          - type: 'null'
          title: Cost Exchange Rate
        lines:
          items:
            $ref: '#/components/schemas/ReceiptLineInput'
          type: array
          minItems: 1
          title: Lines
      type: object
      required:
      - purchase_order_id
      - received_at
      - lines
      title: ReceiptWrite
    InventoryReceiptProof:
      type: object
      required:
      - receipt_id
      - purchase_order_id
      - receipt_line_id
      - order_line_id
      - inventory_item_id
      - warehouse_id
      - quantity
      - unit
      - occurred_at
      - inventory_idempotency_key
      - organization_context
      - original_currency
      - original_unit_cost
      - cost_exchange_rate
      - unit_cost
      properties:
        receipt_id:
          type: string
        purchase_order_id:
          type: string
        receipt_line_id:
          type: string
        order_line_id:
          type: string
        inventory_item_id:
          type: string
        warehouse_id:
          type: string
        quantity:
          type: string
          description: Exact positive quantity
        unit:
          type: string
        occurred_at:
          type: string
          format: date-time
        inventory_idempotency_key:
          type: string
        original_currency:
          type: string
        original_unit_cost:
          type: string
          description: Exact purchase order unit price in document currency
        cost_exchange_rate:
          type: string
          description: Document currency to Society currency multiplier
        unit_cost:
          type: string
          description: Society currency unit cost rounded half up to six decimals
        organization_context:
          type: object
          required:
          - division_ref_id
          - society_ref_id
          - division_code
          - division_name
          - cost_currency
          properties:
            division_ref_id:
              type: string
            society_ref_id:
              type: string
            division_code:
              type: string
            division_name:
              type: string
            cost_currency:
              type: string
    ReasonRequest:
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 3
          title: Reason
      type: object
      required:
      - reason
      title: ReasonRequest
    ListResponse:
      properties:
        data:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Data
      type: object
      required:
      - data
      title: ListResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ReceiptLineInput:
      properties:
        order_line_id:
          type: string
          title: Order Line Id
        quantity:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,12}|(?=[\d.]{1,19}0*$)\d{0,12}\.\d{0,6}0*$)
          title: Quantity
        warehouse_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Warehouse Id
      type: object
      required:
      - order_line_id
      - quantity
      title: ReceiptLineInput
    DataResponse:
      properties:
        data:
          additionalProperties: true
          type: object
          title: Data
      type: object
      required:
      - data
      title: DataResponse
    ReferenceOption:
      properties:
        code:
          type: string
          title: Code
        name_es:
          type: string
          title: Name Es
        name_en:
          type: string
          title: Name En
      type: object
      required:
      - code
      - name_es
      - name_en
      title: ReferenceOption
    PurchasingReferenceDataRead:
      properties:
        currencies:
          items:
            $ref: '#/components/schemas/ReferenceOption'
          type: array
          title: Currencies
        payment_terms:
          items:
            $ref: '#/components/schemas/ReferenceOption'
          type: array
          title: Payment Terms
      type: object
      required:
      - currencies
      - payment_terms
      title: PurchasingReferenceDataRead
    PurchasingReferenceDataResponse:
      properties:
        data:
          $ref: '#/components/schemas/PurchasingReferenceDataRead'
      type: object
      required:
      - data
      title: PurchasingReferenceDataResponse
    PurchaseLineInput:
      properties:
        line_type:
          type: string
          enum:
          - inventory_item
          - service
          title: Line Type
        inventory_item_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Inventory Item Id
        description:
          type: string
          maxLength: 300
          minLength: 1
          title: Description
        quantity:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,12}|(?=[\d.]{1,19}0*$)\d{0,12}\.\d{0,6}0*$)
          title: Quantity
        unit_code:
          type: string
          maxLength: 20
          minLength: 1
          title: Unit Code
        unit_price:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,19}0*$)\d{0,16}\.\d{0,2}0*$)
          - type: 'null'
          title: Unit Price
      type: object
      required:
      - line_type
      - description
      - quantity
      - unit_code
      title: PurchaseLineInput
    PurchasingOrganizationContext:
      additionalProperties: false
      properties:
        cost_currency:
          anyOf:
          - pattern: ^[A-Z]{3}$
            type: string
          - type: 'null'
          default: null
          title: Cost Currency
        division_ref_id:
          maxLength: 40
          minLength: 1
          title: Division Ref Id
          type: string
        society_ref_id:
          maxLength: 40
          minLength: 1
          title: Society Ref Id
          type: string
        division_code:
          maxLength: 120
          minLength: 1
          title: Division Code
          type: string
        division_name:
          maxLength: 240
          minLength: 1
          title: Division Name
          type: string
      required:
      - division_ref_id
      - society_ref_id
      - division_code
      - division_name
      title: OperationalContext
      type: object
    PurchasingCommercialTermsSnapshot:
      type: object
      required:
      - supplier_id
      - terms_revision
      - values
      - division
      properties:
        supplier_id:
          type: string
        terms_revision:
          type: integer
          minimum: 1
        values:
          type: object
          required:
          - currency
          - payment_terms
          - lead_time_days
          properties:
            currency:
              type: string
            payment_terms:
              type: string
            lead_time_days:
              type: integer
              minimum: 0
              maximum: 3650
        division:
          type: object
          required:
          - id
          - society_id
          - code
          - name
          properties:
            id:
              type: string
            society_id:
              type: string
            code:
              type: string
            name:
              type: string
    PurchasingDocumentRead:
      type: object
      additionalProperties: true
      properties:
        organization_context:
          anyOf:
          - $ref: '#/components/schemas/PurchasingOrganizationContext'
          - type: 'null'
        commercial_terms_snapshot:
          anyOf:
          - $ref: '#/components/schemas/PurchasingCommercialTermsSnapshot'
          - type: 'null'
    PurchasingDocumentResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/PurchasingDocumentRead'
    PurchasingDocumentListResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PurchasingDocumentRead'
x-transport-policy:
  implementation-status: local-only
  operation-budget-seconds: 25
  budget-enforcement: cooperative-http-steps-not-database-cancellation
  request-budget-header: X-Request-Timeout-Ms
  request-budget-unit: milliseconds
  request-budget-rule: optional-positive-finite-value-can-only-reduce-budget
  correlation-header: X-Correlation-Id
  error-dependency-field: error.details.dependency_service
  automatic-retries: false
