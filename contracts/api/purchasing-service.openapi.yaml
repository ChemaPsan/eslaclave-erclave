  version: 1.7.0
  summary: 'CC-15 Local: immutable Division/Society document context, explicit supplier conditions and scoped source-to-receipt; Accounting remains
    off.'
servers:
- url: http://127.0.0.1:8010
security:
- bearerAuth: []
