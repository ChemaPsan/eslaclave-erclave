    PurchaseLine:
      type: object
      description: Una partida inventariable exige inventory_item_id; una partida de servicio lo prohibe. unit_code siempre se valida contra el
        catalogo activo de Administracion.
      allOf:
      - if:
          properties:
            line_type:
              const: inventory_item
          required:
          - line_type
        then:
          required:
          - inventory_item_id
          properties:
            inventory_item_id:
              type: string
              minLength: 1
      - if:
          properties:
            line_type:
              const: service
          required:
          - line_type
        then:
          properties:
            inventory_item_id:
              type: 'null'
      required:
      - line_type
      - description
      - quantity
      - unit_code
      properties:
        line_type:
          type: string
          enum:
          - inventory_item
          - service
        inventory_item_id:
          type:
          - string
          - 'null'
          description: Obligatorio solo para inventory_item y prohibido para service.
        description:
          type: string
          minLength: 1
          maxLength: 300
        quantity:
          type: number
          exclusiveMinimum: 0
        unit_code:
          type: string
          minLength: 1
          maxLength: 20
          description: Codigo estable y activo del catalogo tenant-safe de Administracion.
        unit_price:
          type:
          - number
          - 'null'
          minimum: 0
