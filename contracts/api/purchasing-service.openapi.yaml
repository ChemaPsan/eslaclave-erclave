components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    CommercialTerms:
      properties:
        currency:
          type: string
          maxLength: 12
          minLength: 3
          pattern: ^[A-Z0-9._-]+$
          title: Currency
        payment_terms:
          type: string
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9._-]+$
          title: Payment Terms
        lead_time_days:
          type: integer
          maximum: 3650.0
          minimum: 0.0
          title: Lead Time Days
      additionalProperties: false
      type: object
      required:
      - currency
      - payment_terms
      - lead_time_days
      title: CommercialTerms
    CommercialTermsCommand:
      properties:
        expected_revision:
          type: integer
          minimum: 0.0
          title: Expected Revision
        values:
          $ref: '#/components/schemas/CommercialTerms'
      additionalProperties: false
      type: object
      required:
      - expected_revision
      - values
      title: CommercialTermsCommand
    CommercialTermsRead:
      properties:
        resource_id:
          type: string
          title: Resource Id
        division_ref_id:
          type: string
          title: Division Ref Id
        confirmed_society_ref_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Confirmed Society Ref Id
        current_society_ref_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Society Ref Id
        revision:
          type: integer
          title: Revision
        values:
          anyOf:
          - $ref: '#/components/schemas/CommercialTerms'
          - type: 'null'
        requires_confirmation:
          type: boolean
          title: Requires Confirmation
        assignment_active:
          type: boolean
          title: Assignment Active
      type: object
      required:
      - resource_id
      - division_ref_id
      - confirmed_society_ref_id
      - current_society_ref_id
      - revision
      - values
      - requires_confirmation
      - assignment_active
      title: CommercialTermsRead
    CommercialTermsResponse:
      properties:
        data:
          $ref: '#/components/schemas/CommercialTermsRead'
      type: object
      required:
      - data
      title: CommercialTermsResponse
    AssignmentCommand:
      properties:
        expected_revision:
          type: integer
          minimum: 0.0
          title: Expected Revision
        status:
          type: string
          enum:
          - active
          - inactive
          title: Status
          default: active
      additionalProperties: false
      type: object
      required:
      - expected_revision
      title: AssignmentCommand
    AssignmentListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/AssignmentRead'
          type: array
          title: Data
        meta:
          $ref: '#/components/schemas/AssignmentPage'
      type: object
      required:
      - data
      - meta
