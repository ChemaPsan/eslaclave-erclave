      - name: line_id
        in: path
        required: true
        schema:
          type: string
          title: Line Id
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant-Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-required-module: purchasing
      x-permissions:
      - inventory.movement.create
      description: 'CC-15 Local: current tenant and Division scope are checked before commands, idempotent replay, lists and CSV. Requisitions
        freeze organization_context; linked orders inherit it, direct orders require division_ref_id. Orders freeze commercial_terms_snapshot
        (supplier_id, terms_revision, values and Division). Receipts inherit the order context, including services; physical lines require warehouses
        of the same Division. Legacy documents retain null context without backfill; restricted scopes cannot read unassigned legacy documents
        and new operational writes require explicit context. Existing CC-14 receipt recovery remains supported.'
