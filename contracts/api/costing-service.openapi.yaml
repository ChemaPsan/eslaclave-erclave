          minimum: 1.0
          title: Expected Revision
      additionalProperties: false
      type: object
      required:
      - expected_revision
      title: CostCenterStatus
    CostCenterUpdate:
      properties:
        expected_revision:
          type: integer
          minimum: 1.0
          title: Expected Revision
        name:
          type: string
          maxLength: 240
          minLength: 1
          title: Name
      additionalProperties: false
      type: object
      required:
      - expected_revision
      - name
      title: CostCenterUpdate
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PageMeta:
      properties:
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - total
      - limit
      - offset
      title: PageMeta
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    bearerAuth:
