components:
  schemas:
    CostCenterCreate:
      properties:
        name:
          type: string
          maxLength: 240
          minLength: 1
          title: Name
        division_ref_id:
          type: string
          maxLength: 40
          minLength: 1
          title: Division Ref Id
      additionalProperties: false
      type: object
      required:
      - name
      - division_ref_id
      title: CostCenterCreate
    CostCenterListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/CostCenterRead'
          type: array
          title: Data
        meta:
          $ref: '#/components/schemas/PageMeta'
      type: object
      required:
      - data
      - meta
      title: CostCenterListResponse
    CostCenterRead:
      properties:
        id:
          type: string
          title: Id
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
        division_ref_id:
          type: string
          title: Division Ref Id
        status:
          type: string
          enum:
          - active
          - inactive
          title: Status
        revision:
          type: integer
          title: Revision
      type: object
      required:
      - id
      - code
      - name
      - division_ref_id
      - status
      - revision
      title: CostCenterRead
    CostCenterResponse:
      properties:
        data:
          $ref: '#/components/schemas/CostCenterRead'
      type: object
      required:
      - data
      title: CostCenterResponse
    CostCenterStatus:
