          type:
          - string
          - 'null'
          enum:
          - managed
          - manual
          - null
          description: Assigned sequence mode; null for pre-CC-18 history.
        organization_context:
          anyOf:
          - $ref: '#/components/schemas/MaintenanceOrganizationContext'
          - type: 'null'
        worker_context_snapshot:
          type:
          - object
          - 'null'
        labor_cost_snapshot:
          anyOf:
          - $ref: '#/components/schemas/MaintenanceLaborCostSnapshot'
          - type: 'null'
    MaintenanceDocumentResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/MaintenanceDocumentRead'
    MaintenanceDocumentListResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceDocumentRead'
    MaintenanceMaterialProofResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - request_id
          - order_id
          - organization_context
          - warehouse_id
          - inventory_item_id
          - quantity
          - unit
          - line_id
          - line_status
          - request_status
          - order_status
          - source
          properties:
            organization_context:
              anyOf:
              - $ref: '#/components/schemas/MaintenanceOrganizationContext'
              - type: 'null'
            quantity:
              type:
              - number
              - string
            unit_cost_snapshot:
              type:
              - number
              - string
              - 'null'
            source:
              type: object
          additionalProperties: true
x-transport-policy:
  implementation-status: local-only
  operation-budget-seconds: 25
  budget-enforcement: cooperative-http-steps-not-database-cancellation
  request-budget-header: X-Request-Timeout-Ms
  request-budget-unit: milliseconds
  request-budget-rule: optional-positive-finite-value-can-only-reduce-budget
  correlation-header: X-Correlation-Id
  error-dependency-field: error.details.dependency_service
  automatic-retries: false
