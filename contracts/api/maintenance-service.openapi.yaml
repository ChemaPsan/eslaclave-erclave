        id:
          type: string
        order_id:
          type: string
        order_code:
          type: string
          description: Included in the Warehouse inbox.
        order_title:
          type: string
          description: Included in the Warehouse inbox.
        assigned_worker_id:
          type:
          - string
          - 'null'
        assigned_worker_name:
          type:
          - string
          - 'null'
        warehouse_id:
          type: string
        warehouse_name:
          type: string
        status:
          type: string
          enum:
          - processing
          - reserved
          - issued
          - cancelling
          - cancelled
          - needs_reconciliation
        pending_operation:
          type:
          - string
          - 'null'
          enum:
          - reserve
          - issue
          - cancel
          - null
        integration_error:
          type:
          - string
          - 'null'
        integration_attempts:
          type: integer
        last_integration_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              line_number:
                type: integer
              item_id:
                type: string
              item_code:
                type: string
              item_name:
                type: string
              quantity:
                type: number
              unit_code:
                type: string
              reservation_id:
                type:
                - string
                - 'null'
              inventory_movement_id:
                type:
                - string
                - 'null'
              unit_cost_snapshot:
                type:
                - number
                - 'null'
              line_status:
                type: string
    MaintenanceOrderCreateRequest:
      type: object
      required:
      - target_type
      - priority
      - title
      - description
      - location
      properties:
        code:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 60
          description: Optional manual code; Admin decides whether the effective sequence is managed or manual.
        target_type:
          type: string
          enum:
          - production_machine
