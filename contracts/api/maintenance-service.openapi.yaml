        '503':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
      x-implementation-status: implemented
  /v1/maintenance/orders/{id}/reconcile:
    post:
      tags:
      - MaintenanceOrders
      operationId: reconcileMaintenanceOrder
      summary: Retry the durable pending Production operation; material issues must be reconciled by Warehouse from Movements.
      x-required-module: maintenance
      x-permissions: [maintenance.order.reconcile]
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Reconciliation attempted and current durable state returned.
  /v1/maintenance/orders/{id}/time-entries:
    get:
      tags:
      - Labor
      operationId: listMaintenanceTimeEntries
      x-required-module: maintenance
      x-permissions: [maintenance.time.read]
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Time entries.
    post:
      tags:
      - Labor
      operationId: createMaintenanceTimeEntry
      x-required-module: maintenance
      x-permissions: [maintenance.time.create]
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryCreateRequest'
      responses:
        '201':
          description: Time entry created.
  /v1/maintenance/orders/{id}/material-requests:
    get:
      tags:
      - SpareParts
      operationId: listMaintenanceMaterialRequests
      x-required-module: maintenance
      x-permissions: [maintenance.material_request.read]
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Material requests and Inventory reconciliation status.
    post:
      tags:
      - SpareParts
      operationId: createMaintenanceMaterialRequest
      summary: Create a multi-line internal request against a spare-parts warehouse.
      description: Creation and Inventory reservation are serialized with material recovery, cancellation and issue for the same tenant and order. A concurrent command returns command_in_progress.
      x-required-module: maintenance
      x-permissions: [maintenance.material_request.create]
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialRequestCreateRequest'
      responses:
        '201':
          description: Material request created and ready for Inventory reservation.
  /v1/maintenance/material-requests/{id}/cancel:
    post:
      tags:
      - SpareParts
      operationId: cancelMaintenanceMaterialRequest
      x-required-module: maintenance
      x-permissions: [maintenance.material_request.cancel]
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Request cancelled and active reservations released.
  /v1/maintenance/material-requests/{id}/reconcile:
    post:
      tags:
      - SpareParts
      operationId: reconcileMaintenanceMaterialRequest
      summary: Retry only the pending reservation or release lines using stable Inventory keys.
      description: Resumes needs_reconciliation, interrupted processing/reserve and cancelling/cancel under order and request locks. The same unfinished idempotency key can resume when no command is running. Completed requests return without Inventory effects. Reservations never issue stock; Warehouse confirms delivery separately.
      x-required-module: maintenance
      x-permissions: [maintenance.material_request.reconcile]
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Material reconciliation attempted and current durable state returned.
  /v1/maintenance/returnable-materials:
    get:
      tags:
      - maintenance
      summary: Returnable Materials
      operationId: returnable_materials_v1_maintenance_returnable_materials_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant-Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '409':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '503':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
      x-implementation-status: implemented
      x-required-module: maintenance
      x-permissions: [inventory.movement.read, maintenance.material_request.create]
      x-required-modules:
      - maintenance
      - inventory
  /v1/maintenance/material-returns/validate:
    post:
      tags:
      - maintenance
      summary: Validate Material Return
      operationId: validate_material_return_v1_maintenance_material_returns_validate_post
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant-Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialReturnValidation'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '409':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '503':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
      x-implementation-status: implemented
      x-required-module: maintenance
      x-permissions: [inventory.movement.create, maintenance.material_request.create]
      x-required-modules:
      - maintenance
      - inventory
  /v1/maintenance/material-returns/reconcile:
    post:
      tags:
      - maintenance
      summary: Reconcile Material Return
      operationId: reconcile_material_return_v1_maintenance_material_returns_reconcile_post
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant-Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialReturnReconcile'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '409':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '503':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
      x-implementation-status: implemented
      x-required-module: maintenance
      x-permissions: [inventory.movement.create]
      x-required-modules:
      - maintenance
      - inventory
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 120
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 160
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
    Search:
      name: q
      in: query
      schema:
        type: string
        maxLength: 120
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
  schemas:
    WarehouseMaterialRequest:
      type: object
      required:
      - id
      - order_id
      - warehouse_id
      - warehouse_name
      - status
      - lines
      properties:
        id:
          type: string
        order_id:
          type: string
        order_code:
          type: string
          description: Included in the Warehouse inbox.
        order_title:
          type: string
          description: Included in the Warehouse inbox.
