        '409':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '503':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
      x-implementation-status: implemented
  /v1/maintenance/orders/{id}/transitions:
    post:
      tags:
      - MaintenanceOrders
      operationId: transitionMaintenanceOrder
      summary: Transition Order
      x-required-module: maintenance
      x-permissions: [maintenance.order.request, maintenance.order.assign, maintenance.order.start, maintenance.order.wait_for_parts, maintenance.order.resume, maintenance.order.resolve, maintenance.order.close, maintenance.order.reopen, maintenance.order.cancel]
      x-permission-mode: by-requested-transition
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant-Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '409':
