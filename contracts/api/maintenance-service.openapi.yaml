        worker_id:
          type: string
        labor_position_id:
          type: string
        position_code:
          type:
          - string
          - 'null'
          description: RH position code frozen for new time entries; null for historical snapshots.
        hourly_cost:
          type: string
        currency:
          type: string
        society_ref_id:
          type: string
        duration_seconds:
          type: string
        labor_cost:
          type: string
        rounding_rule:
          const: half_up_6
