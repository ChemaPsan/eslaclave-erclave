      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
  schemas:
    WarehouseMaterialRequest:
      type: object
      required:
      - id
      - order_id
      - warehouse_id
      - warehouse_name
      - status
      - lines
