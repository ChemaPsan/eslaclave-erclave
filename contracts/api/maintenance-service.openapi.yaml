openapi: 3.1.0
x-implementation-status: implemented
info:
  title: ERClave Maintenance Service API
  version: 1.0.0
  summary: Corrective maintenance orders, assignments, labor and spare-parts requests.
servers:
- url: http://127.0.0.1:8012
security:
- bearerAuth: []
tags:
- name: MaintenanceOrders
- name: Labor
- name: SpareParts
paths:
  /v1/maintenance/warehouse-material-requests:
    get:
      tags:
      - SpareParts
      operationId: listWarehouseMaintenanceMaterialRequests
      summary: Pending spare-parts requests for Warehouse Movements, without technical order evidence.
      x-required-module: maintenance
      x-required-modules:
      - maintenance
      - inventory
      x-permissions: [inventory.movement.read]
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Pending requests ordered by creation and ID; issued and cancelled requests are excluded.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - page
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WarehouseMaterialRequest'
                  page:
                    type: object
                    required:
                    - limit
                    - offset
                    - has_more
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      has_more:
                        type: boolean
  /v1/maintenance/material-requests/{id}/issue:
    post:
      tags:
      - SpareParts
      operationId: issueWarehouseMaintenanceMaterialRequest
      summary: Warehouse authorizes and confirms delivery of all reserved request lines to the assigned technician.
      description: Records immutable Inventory exits with the warehouse actor. Retries only unconfirmed lines with stable reservation keys. An
        issued request is replayed without effects. Partial delivery quantities are not accepted. Resolve never issues materials.
      x-required-module: maintenance
      x-required-modules:
      - maintenance
      - inventory
      x-permissions: [inventory.movement.create]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Current request, issued or needs_reconciliation with pending_operation issue; a pending state is not delivery success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WarehouseMaterialRequest'
        '403':
          description: Warehouse movement permission or module is missing.
        '404':
          description: Request does not exist in this tenant.
        '409':
          description: Request is not issuable or another command owns its lock.
  /v1/maintenance/material-requests/{id}/reject:
    post:
      tags:
      - SpareParts
      operationId: rejectWarehouseMaintenanceMaterialRequest
      summary: Reject an unissued request with an audited reason and release its reservations without an exit.
      x-required-module: maintenance
      x-required-modules:
      - maintenance
      - inventory
      x-permissions: [inventory.movement.create]
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '200':
          description: Cancelled request or needs_reconciliation with pending_operation cancel; retry rejection to release remaining lines.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WarehouseMaterialRequest'
        '403':
          description: Warehouse movement permission or module is missing.
        '404':
          description: Request does not exist in this tenant.
        '409':
          description: Delivery has started or another command owns the request lock.
  /v1/maintenance/reports/{report_code}/export:
    get:
      tags:
      - Reports
      operationId: exportMaintenanceStandardReport
      summary: Export a fixed Maintenance report as UTF-8 CSV.
      x-required-module: maintenance
      x-permissions: [maintenance.order.read, maintenance.time.read, maintenance.material_request.read]
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: report_code
        in: path
        required: true
        schema:
          type: string
      - name: lang
        in: query
        schema:
          type: string
          enum:
          - es
          - en
          default: es
      - name: date_from
        in: query
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        schema:
          type: string
          format: date
      - name: status
        in: query
        schema:
          type: string
      - name: priority
        in: query
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
      - name: target_type
        in: query
        schema:
          type: string
      - name: responsible_worker_id
        in: query
        schema:
          type: string
      - name: worker_id
        in: query
        schema:
          type: string
      - name: warehouse_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: CSV export.
        '204':
          description: No rows matched the filters.
  /v1/maintenance/orders:
    get:
      tags:
      - MaintenanceOrders
      operationId: searchMaintenanceOrders
      summary: Orders
      x-required-module: maintenance
      x-permissions: [maintenance.order.read]
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 100
          title: Limit
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant-Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '409':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '503':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
      x-implementation-status: implemented
    post:
      tags:
      - MaintenanceOrders
      operationId: createMaintenanceOrder
      summary: Create Order
      x-required-module: maintenance
      x-permissions: [maintenance.order.create]
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant-Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '409':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '503':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
      x-implementation-status: implemented
  /v1/maintenance/orders/{id}:
