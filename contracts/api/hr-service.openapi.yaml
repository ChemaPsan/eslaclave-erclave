          - type: string
          - type: 'null'
          title: X-Tenant-Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerDivisionCommand'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerDivisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          description: Stable assignment error envelope; capture and prior state are preserved.
        '401':
          description: Stable assignment error envelope; capture and prior state are preserved.
        '403':
          description: Stable assignment error envelope; capture and prior state are preserved.
        '404':
          description: Stable assignment error envelope; capture and prior state are preserved.
        '409':
          description: Stable assignment error envelope; capture and prior state are preserved.
        '503':
          description: Stable assignment error envelope; capture and prior state are preserved.
      x-required-module: hr
      x-permissions: [hr.worker.update]
  /v1/hr/division-workers:
    get:
      tags:
      - Organization assignments
      summary: Eligible Workers
      operationId: eligible_workers_v1_hr_division_workers_get
      parameters:
      - name: division_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 40
          title: Division Id
      - name: purpose
        in: query
        required: false
        schema:
          enum:
          - all
          - production
          - maintenance
          type: string
