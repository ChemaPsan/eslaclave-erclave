      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibleWorkersResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Stable error envelope; no partial document effect.
        '403':
          description: Stable error envelope; no partial document effect.
        '404':
          description: Stable error envelope; no partial document effect.
        '409':
          description: Stable error envelope; no partial document effect.
        '503':
          description: Stable error envelope; no partial document effect.
      x-required-module: hr
      x-permissions: [hr.worker.read, sales.order.create, sales.quote.approve, sales.quote.submit, sales.quote.update, sales.service_order.accept, sales.service_order.assign, sales.service_order.cost.create, sales.service_order.evidence.create, sales.service_order.plan, sales.service_order.resume, sales.service_order.start, sales.service_order.submit_acceptance, sales.service_order.time.create, production.order.validate, production.order.release, production.order.start, production.order.resume, maintenance.order.assign, maintenance.order.start, maintenance.order.resume, maintenance.order.reopen, maintenance.time.create]
  /v1/hr/reports/{report_code}/export:
    get:
      tags:
      - Reports
      operationId: exportHrStandardReport
      summary: Export a fixed HR report as UTF-8 CSV without sensitive worker identifiers.
      x-required-module: hr
      x-permissions: [hr.position.read, hr.worker.read]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: report_code
        in: path
        required: true
        schema:
          type: string
      - name: lang
        in: query
        schema:
          type: string
          enum:
          - es
          - en
          default: es
      - name: status
        in: query
        schema:
          type: string
      - name: purpose
        in: query
        schema:
          type: string
          enum:
          - production
          - maintenance
          - sales
      - name: area_id
        in: query
        schema:
          type: string
      - name: position_id
        in: query
        schema:
          type: string
      - name: eligibility
        in: query
        schema:
          type: string
          enum:
          - production
          - maintenance
      responses:
        '200':
          description: CSV export.
        '204':
          description: No rows matched the filters.
  /v1/hr/areas:
