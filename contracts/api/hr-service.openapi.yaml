          - type: string
            maxLength: 128
          - type: 'null'
          title: X-Correlation-Id
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionDivisionCommand'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionDivisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          description: Stable assignment error envelope; capture and prior state are preserved.
        '401':
          description: Stable assignment error envelope; capture and prior state are preserved.
        '403':
          description: Stable assignment error envelope; capture and prior state are preserved.
        '404':
          description: Stable assignment error envelope; capture and prior state are preserved.
        '409':
          description: Stable assignment error envelope; capture and prior state are preserved.
        '503':
          description: Stable assignment error envelope; capture and prior state are preserved.
      x-required-module: hr
      x-permissions: [hr.position.update]
  /v1/hr/division-positions:
