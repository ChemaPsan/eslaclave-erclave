      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: area_id
        in: query
        schema:
          type: string
      - name: production_only
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionListResponse'
    post:
      tags:
      - Positions
      operationId: createHrPosition
