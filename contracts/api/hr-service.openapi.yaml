      - Areas
      operationId: listHrAreas
      x-required-module: hr
      x-permissions: [hr.area.read]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Areas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaListResponse'
    post:
      tags:
      - Areas
      operationId: createHrArea
      x-required-module: hr
      x-permissions: [hr.area.create]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaCreate'
      responses:
        '201':
          description: Area created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaResponse'
  /v1/hr/areas/{id}:
    patch:
      tags:
      - Areas
      operationId: updateHrArea
