        '403':
          description: Stable assignment error envelope; capture and prior state are preserved.
        '404':
          description: Stable assignment error envelope; capture and prior state are preserved.
        '409':
          description: Stable assignment error envelope; capture and prior state are preserved.
        '503':
          description: Stable assignment error envelope; capture and prior state are preserved.
      x-required-module: hr
      x-permissions: [hr.position.read]
  /v1/hr/positions/{resource_id}/division-assignments/{division_id}:
