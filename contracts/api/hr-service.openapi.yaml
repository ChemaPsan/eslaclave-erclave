      - Organization assignments
      summary: Assign Worker
      operationId: assign_worker_v1_hr_workers__resource_id__division_assignments__division_id__put
      parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 40
          title: Resource Id
      - name: division_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 40
          title: Division Id
      - name: Idempotency-Key
        in: header
