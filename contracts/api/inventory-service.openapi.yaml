openapi: 3.1.0
info:
  title: ERClave Inventory Service API
  version: 0.2.0
  summary: Warehouse, item, movement, balance, kardex and reservation APIs.
servers:
- url: https://api.eslaclave.com
security:
- bearerAuth: []
tags:
- name: Warehouses
- name: Items
- name: Movements
- name: Balances
- name: Reservations
paths:
  /v1/inventory/reports/{report_code}/export:
    get:
      tags:
      - Reports
      operationId: exportInventoryStandardReport
      summary: Export a fixed Inventory report as UTF-8 CSV.
      x-required-module: inventory
      x-permissions: [inventory.warehouse.read, inventory.item.read, inventory.balance.read, inventory.kardex.read]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: report_code
        in: path
        required: true
        schema:
          type: string
      - name: lang
        in: query
        schema:
          type: string
          enum:
          - es
          - en
          default: es
      - name: date_from
        in: query
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        schema:
          type: string
          format: date
      - name: status
        in: query
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
      - name: category
        in: query
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
          maxLength: 120
      - name: warehouse_id
        in: query
        schema:
          type: string
      - name: item_id
        in: query
        schema:
          type: string
      - name: movement_type
        in: query
        schema:
          type: string
      - name: condition
        in: query
        schema:
          type: string
      responses:
        '200':
          description: CSV export.
        '204':
          description: No rows matched the filters.
  /v1/inventory/warehouses:
    get:
      tags:
      - Warehouses
      operationId: listWarehouses
      summary: Warehouses
      x-required-module: inventory
      x-permissions: [inventory.movement.create, inventory.movement.read, inventory.warehouse.read, maintenance.material_request.create, maintenance.material_request.read]
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '409':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '503':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
      x-implementation-status: implemented
    post:
      tags:
      - Warehouses
      operationId: createWarehouse
      summary: Create Warehouse
      x-required-module: inventory
      x-permissions: [inventory.warehouse.create]
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '409':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '503':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
      x-implementation-status: implemented
  /v1/inventory/warehouses/{id}:
    get:
      tags:
      - Warehouses
      operationId: getWarehouse
      summary: Get one tenant warehouse for Inventory or Purchasing validation.
      x-required-module: inventory
      x-permissions: [inventory.warehouse.read, maintenance.material_request.create, purchasing.receipt.create]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Warehouse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseResponse'
    patch:
      tags:
      - Warehouses
      operationId: updateWarehouse
      summary: Update warehouse.
      x-required-module: inventory
      x-permissions: [inventory.warehouse.update]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseUpdateRequest'
      responses:
        '200':
          description: Warehouse updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseResponse'
  /v1/inventory/warehouses/{id}/locations:
    post:
      tags:
      - Warehouses
      operationId: createWarehouseLocation
      summary: Create warehouse location.
      x-required-module: inventory
      x-permissions: [inventory.location.create]
      x-implementation-status: planned
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationCreateRequest'
      responses:
        '201':
          description: Location created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
  /v1/inventory/items:
    get:
      tags:
      - Items
      operationId: listInventoryItems
      summary: Search inventory items.
      x-required-module: inventory
      x-permissions: [inventory.item.read, maintenance.material_request.create, maintenance.material_request.read, production.product_service.create, production.product_service.update, purchasing.order.create, purchasing.order.issue, purchasing.order.update, purchasing.requisition.create, purchasing.requisition.update, sales.order.fulfill]
      x-permission-mode: any
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/Status'
      - name: use_in_recipe
        in: query
        description: Return only items explicitly eligible or ineligible for production recipes.
        schema:
          type: boolean
      - name: type
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemListResponse'
    post:
      tags:
      - Items
      operationId: createInventoryItem
      summary: Create inventory item.
      x-required-module: inventory
      x-permissions: [inventory.item.create]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreateRequest'
      responses:
        '201':
          description: Item created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
  /v1/inventory/items/{id}:
    get:
      tags:
      - Items
      operationId: getInventoryItem
      summary: Get inventory item.
      x-required-module: inventory
      x-permissions: [inventory.item.read, maintenance.material_request.create, production.product_service.create, production.product_service.update, purchasing.order.create, purchasing.order.issue, purchasing.order.update, purchasing.requisition.create, purchasing.requisition.update, sales.order.fulfill]
      x-permission-mode: any
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Item detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
    patch:
      tags:
      - Items
      operationId: updateInventoryItem
      summary: Update inventory item.
      x-required-module: inventory
      x-permissions: [inventory.item.update]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdateRequest'
      responses:
        '200':
          description: Item updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
  /v1/inventory/items/{id}/unit-conversion:
    post:
      tags:
      - Items
      operationId: convertInventoryItemUnit
      summary: Convert a quantity and optional unit cost to the item's authoritative base unit.
      x-required-module: inventory
      x-permissions: [inventory.item.read]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitConversionRequest'
      responses:
        '200':
          description: Quantity and cost expressed in the item's base unit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitConversionResponse'
        '422':
          description: Units are inactive, incompatible, or require an item-specific conversion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/inventory/balances:
    get:
      tags:
      - Balances
      operationId: listInventoryBalances
      summary: List calculated inventory balances.
      x-required-module: inventory
      x-permissions: [inventory.balance.read]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Search'
      - name: inventory_item_id
        in: query
        schema:
          type: string
      - name: warehouse_id
        in: query
        schema:
          type: string
      - name: category
        in: query
        schema:
          type: string
      - name: item_type
        in: query
        schema:
          type: string
      - name: item_status
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
          - blocked
      - name: inventory_policy
        in: query
        schema:
          type: string
      - name: unit
        in: query
        schema:
          type: string
      - name: stock_status
        in: query
        schema:
          type: string
          enum:
          - negative
          - out_of_stock
          - below_minimum
          - normal
          - above_maximum
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - item_code
          - item_name
          - on_hand_asc
          - on_hand_desc
          default: item_code
      responses:
        '200':
          description: Balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceListResponse'
  /v1/inventory/kardex:
    get:
      tags:
      - Balances
      operationId: listKardex
      summary: List kardex entries calculated from movements.
      x-required-module: inventory
      x-permissions: [inventory.kardex.read]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: inventory_item_id
        in: query
        schema:
          type: string
      - name: warehouse_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Kardex.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementListResponse'
  /v1/inventory/movements:
    get:
      tags:
      - Movements
      operationId: listInventoryMovements
      summary: Movements
      x-required-module: inventory
      x-permissions: [inventory.movement.read]
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '409':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '503':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
      x-implementation-status: implemented
    post:
      tags:
      - Movements
      operationId: createInventoryMovement
      summary: Create Movement
      x-required-module: inventory
      x-permissions: [inventory.movement.create]
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '409':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '503':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
      x-implementation-status: implemented
      description: A transfer records only its outgoing movement; the destination must confirm receipt through the transfer workflow. Reversal
        compensators and reversed originals both remain in the authoritative ledger.
  /v1/inventory/purchase-receipts:
    post:
      tags:
      - Movements
      operationId: createInventoryPurchaseReceiptMovement
      summary: Create Purchase Receipt Movement
      x-required-module: inventory
      x-permissions: [inventory.movement.create]
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '409':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '503':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
      x-implementation-status: implemented
      description: Warehouse-only physical purchase receipt; Purchasing preparation does not create stock. Stable receipt-line idempotency keys
        prevent duplicate entries.
  /v1/inventory/availability-checks:
    post:
      tags:
      - Balances
      operationId: createAvailabilityCheck
      summary: Check item availability for production or sales.
      x-required-module: inventory
      x-permissions: [production.order.release, production.order.validate]
      x-permission-mode: any
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityCheckRequest'
      responses:
        '200':
          description: Availability result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityCheckResponse'
  /v1/inventory/consumption-requests:
    post:
      tags:
      - Movements
      operationId: createConsumptionRequest
      summary: Register production consumption requested by production-service.
      x-required-module: inventory
      x-permissions: [internal.production.inventory.consume]
      x-implementation-status: planned
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalMovementRequest'
      responses:
        '201':
          description: Consumption movement recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementResponse'
  /v1/inventory/finished-goods-receipts:
    get:
      tags:
      - Movements
      operationId: listFinishedGoodsReceipts
      summary: List received quantities grouped by production order.
      x-required-module: inventory
      x-permissions: [inventory.finished_goods_receipt.read]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Finished-goods receipt summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishedGoodsReceiptListResponse'
    post:
      tags:
      - Movements
      operationId: createFinishedGoodsReceipt
      summary: Confirm physical receipt of a completed production order.
      x-required-module: inventory
      x-permissions: [inventory.finished_goods_receipt.receive]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishedGoodsReceiptCreateRequest'
      responses:
        '201':
          description: Receipt movement recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishedGoodsReceiptResponse'
        '409':
          description: Order is not completed, mapping is invalid, units differ, or quantity exceeds the pending amount.
  /v1/inventory/reservation-requests:
    post:
      tags:
      - Reservations
      operationId: createReservationRequest
      description: Maintenance requests without an explicit expiry remain reserved until issue or release; other sources retain their 24-hour
        default. Historical reservations are not rewritten.
      summary: Create inventory reservation.
      x-required-module: inventory
      x-permissions: [maintenance.material_request.create, production.order.release, sales.order.fulfill]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreateRequest'
      responses:
        '201':
          description: Reservation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
  /v1/inventory/transfers:
    get:
      tags:
      - inventory
      summary: Transfers
      operationId: transfers_v1_inventory_transfers_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '409':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '503':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
      x-implementation-status: implemented
      x-required-module: inventory
      x-permissions: [inventory.movement.read]
  /v1/inventory/material-returns:
    get:
      tags:
      - inventory
      summary: Material Returns
