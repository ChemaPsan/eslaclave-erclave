openapi: 3.1.0
info:
  title: ERClave Production Service API
  version: 0.2.0
  summary: Product, recipe, production order and machine APIs; labor catalogs belong to hr-service.
servers:
  - url: https://api.eslaclave.com
security:
  - bearerAuth: []
tags:
  - name: ProductServices
  - name: Recipes
  - name: Orders
  - name: Machines
paths:
  /v1/production/product-services:
    get:
      tags: [ProductServices]
      operationId: listProductServices
      summary: Search product and service catalog.
      x-required-module: production
      x-permissions: [production.product_service.read, sales.quote.create, sales.quote.update, sales.order.create, sales.order.fulfill]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
        - name: type
          in: query
          schema:
            type: string
            enum: [product, service]
        - name: inventory_mapping
          in: query
          description: Filter products by authoritative Inventory mapping state.
          schema:
            type: string
            enum: [missing, linked]
      responses:
        '200':
          description: Product services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductServiceListResponse'
    post:
      tags: [ProductServices]
      operationId: createProductService
      summary: Create product or service.
      x-required-module: production
      x-permissions: [production.product_service.create]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductServiceCreateRequest'
      responses:
        '201':
          description: Product service created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductServiceResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/production/product-services/{id}:
    get:
      tags: [ProductServices]
      operationId: getProductService
      summary: Get product or service detail.
      x-required-module: production
      x-permissions: [production.product_service.read, sales.quote.create, sales.quote.update, sales.order.create, sales.order.fulfill]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Product service detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductServiceResponse'
    patch:
      tags: [ProductServices]
      operationId: updateProductService
      summary: Update product or service.
      x-required-module: production
      x-permissions: [production.product_service.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductServiceUpdateRequest'
      responses:
        '200':
          description: Product service updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductServiceResponse'
  /v1/production/product-services/{id}/status:
    patch:
      tags: [ProductServices]
      operationId: updateProductServiceStatus
      summary: Change product or service status.
      x-required-module: production
      x-permissions: [production.product_service.status.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
      responses:
        '200':
          description: Status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductServiceResponse'
  /v1/production/product-services/{id}/finished-good-link:
    put:
      tags: [ProductServices]
      operationId: createAndLinkFinishedGood
      summary: Create an Inventory finished good and link it to an active Production product.
      x-required-module: production
      x-permissions: [production.product_service.update, inventory.item.create]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishedGoodLinkRequest'
      responses:
        '200':
          description: Article created and linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishedGoodLinkResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/production/product-services/{id}/cost-summary:
    get:
      tags: [ProductServices]
      operationId: getProductServiceCostSummary
      summary: Get standard cost summary from approved recipe.
      x-required-module: production
      x-permissions: [production.product_service.read]
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Cost summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostSummaryResponse'
  /v1/production/recipes:
    get:
      tags: [Recipes]
      operationId: listRecipes
      summary: Search recipes.
      x-required-module: production
      x-permissions: [production.recipe.read]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Recipes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeListResponse'
    post:
      tags: [Recipes]
      operationId: createRecipe
      summary: Create recipe for existing product or service.
      x-required-module: production
      x-permissions: [production.recipe.create]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeCreateRequest'
      responses:
        '201':
          description: Recipe created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
        '422':
          description: Product, unit, stage, or authoritative recipe resource is not eligible; machinery must be active and linked to an active HR area.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/production/recipes/{id}:
    get:
      tags: [Recipes]
      operationId: getRecipe
      summary: Get recipe with versions.
      x-required-module: production
      x-permissions: [production.recipe.read]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Recipe detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
  /v1/production/recipes/{id}/versions:
    post:
      tags: [Recipes]
      operationId: createRecipeVersion
      summary: Create new recipe version.
      x-required-module: production
      x-permissions: [production.recipe.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeVersionCreateRequest'
      responses:
        '201':
          description: Recipe version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeVersionResponse'
        '422':
          description: Product, unit, stage, or authoritative recipe resource is not eligible; machinery must be active and linked to an active HR area.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/production/recipe-versions/{version_id}:
    patch:
      tags: [Recipes]
      operationId: updateRecipeVersion
      summary: Update draft recipe version.
      x-required-module: production
      x-permissions: [production.recipe.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: version_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeVersionUpdateRequest'
      responses:
        '200':
          description: Version updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeVersionResponse'
        '422':
          description: Product, unit, stage, or authoritative recipe resource is not eligible; machinery must be active and linked to an active HR area.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/production/recipe-versions/{version_id}/submit:
    post:
      tags: [Recipes]
      operationId: submitRecipeVersion
      summary: Submit recipe version for approval.
      x-required-module: production
      x-permissions: [production.recipe.submit]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: version_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Version submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeVersionResponse'
  /v1/production/recipe-versions/{version_id}/approve:
    post:
      tags: [Recipes]
      operationId: approveRecipeVersion
      summary: Approve recipe version as usable for new orders.
      x-required-module: production
      x-permissions: [production.recipe.approve]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: version_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Version approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeVersionResponse'
  /v1/production/recipe-versions/{version_id}/obsolete:
    post:
      tags: [Recipes]
      operationId: obsoleteRecipeVersion
      summary: Mark recipe version obsolete.
      x-required-module: production
      x-permissions: [production.recipe.obsolete]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: version_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Version obsoleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeVersionResponse'
  /v1/production/resource-validations:
    post:
      tags: [Orders]
      operationId: validateProductionResources
      summary: Validate resources before creating or releasing an order.
      x-required-module: production
      x-permissions: [production.order.validate]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceValidationRequest'
      responses:
        '200':
          description: Resource validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceValidationResponse'
  /v1/production/orders:
    get:
      tags: [Orders]
      operationId: listProductionOrders
      summary: Search production orders.
      x-required-module: production
      x-permissions: [production.order.read]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Production orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderListResponse'
    post:
      tags: [Orders]
      operationId: createProductionOrder
      summary: Create manual production order from approved recipe.
      x-required-module: production
      x-permissions: [production.order.create]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionOrderCreateRequest'
      responses:
        '201':
          description: Production order created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderResponse'
  /v1/production/order-requests:
    get:
      tags: [Orders]
      operationId: listProductionOrderRequests
      summary: List authoritative Sales requests awaiting Production planning.
      x-implementation-status: implemented
      x-required-module: production
      x-permissions: [production.order.read]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: status
          in: query
          schema: {type: string, enum: [pending_configuration, converted, cancelled]}
      responses:
        '200': {description: Production requests., content: {application/json: {schema: {$ref: '#/components/schemas/ProductionSalesRequestListResponse'}}}}
    post:
      tags: [Orders]
      operationId: createProductionOrderRequest
      summary: Register an authoritative Sales request without releasing a Production order.
      x-implementation-status: implemented
      x-required-module: production
      x-permissions: [sales.order.fulfill]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionOrderRequest'
      responses:
        '201':
          description: Production request registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionSalesRequestResponse'
  /v1/production/orders/{id}:
    get:
      tags: [Orders]
      operationId: getProductionOrder
      summary: Get production order detail.
      x-required-module: production
      x-permissions: [production.order.read]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Production order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderResponse'
  /v1/production/orders/{id}/status:
    patch:
      tags: [Orders]
      operationId: updateProductionOrderStatus
      summary: Change production order status.
      description: All local transition, stage, reservation-snapshot and actual-usage preconditions are checked before any external Inventory effect. Materials are reserved when an order is released. The first transition from released or waiting_resources to in_progress consumes each reservation through Inventory, which records one immutable outbound movement in the warehouse that owned the reservation. Resuming from paused or returning from validation does not consume again. Completion requires every stage to be completed or skipped and never duplicates the material issue. Cancelling before start releases reservations; cancelling after start preserves the recorded physical issues.
      x-required-module: production
      x-permissions: [production.order.status.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionOrderStatusRequest'
      responses:
        '200':
          description: Status changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderResponse'
  /v1/production/orders/{id}/resources/{resource_id}:
    patch:
      tags: [Orders]
      operationId: updateProductionOrderResourceActual
      summary: Record actual labor or machine usage for operational costing.
      x-required-module: production
      x-permissions: [production.order.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdPath'
        - name: resource_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionOrderResourceUpdateRequest'
      responses:
        '200':
          description: Actual resource usage recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderResourceResponse'
  /v1/production/order-stages/{stage_id}:
    patch:
      tags: [Orders]
      operationId: updateProductionOrderStage
      summary: Update order stage.
      description: Starting a stage requires its production order to already be in_progress. The client must first change the order status so Inventory can confirm all material issues; this endpoint never bypasses that rule.
      x-required-module: production
      x-permissions: [production.order_stage.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: stage_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStageUpdateRequest'
      responses:
        '200':
          description: Stage updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStageResponse'
  /v1/production/machines:
    get:
      tags: [Machines]
      operationId: listMachines
      summary: List machines.
      x-required-module: production
      x-permissions: [production.machine.read]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Machines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineListResponse'
    post:
      tags: [Machines]
      operationId: createMachine
      summary: Create machine.
      x-required-module: production
      x-permissions: [production.machine.create]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MachineCreateRequest'
      responses:
        '201':
          description: Machine created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineResponse'
  /v1/production/machines/{machine_id}:
    patch:
      tags: [Machines]
      operationId: updateMachine
      summary: Update machine.
      x-required-module: production
      x-permissions: [production.machine.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - name: machine_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MachineUpdateRequest'
      responses:
        '200':
          description: Machine updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Search:
      name: q
      in: query
      schema:
        type: string
    Status:
      name: status
      in: query
      schema:
        type: string
  responses:
    Conflict:
      description: Conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            correlation_id:
              type: string
            details:
              type: object
              additionalProperties: true
    Page:
      type: object
      properties:
        limit:
          type: integer
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
    ProductService:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [product, service]
        category:
          type: string
        base_unit:
          type: string
        status:
          type: string
          enum: [active, inactive, pending_approval]
        target_price:
          type: number
        standard_cost:
          type: number
        responsible_area:
          type: string
        cost_center:
          type: string
        expected_margin:
          type: number
        description:
          type: string
        inventory_item_id:
          type: [string, 'null']
          description: Authoritative Inventory item mapping; required for products and forbidden for services.
    ProductServiceResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ProductService'
    ProductServiceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductService'
        page:
          $ref: '#/components/schemas/Page'
    FinishedGoodItemCreate:
      type: object
      required: [code, name, type, base_unit]
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [finishedGood] }
        category: { type: [string, 'null'] }
        base_unit: { type: string }
        inventory_policy: { type: string, enum: [standard, lot, serial, restricted], default: standard }
        suggested_warehouse_id: { type: [string, 'null'] }
        minimum_stock: { type: number, minimum: 0, default: 0 }
        maximum_stock: { type: number, minimum: 0, default: 0 }
        default_unit_cost: { type: number, minimum: 0, default: 0 }
        use_in_recipe: { type: boolean, default: false }
        description: { type: [string, 'null'] }
    FinishedGoodLinkRequest:
      type: object
      required: [inventory_item]
      properties:
        inventory_item: { $ref: '#/components/schemas/FinishedGoodItemCreate' }
    FinishedGoodLinkResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            product_service: { $ref: '#/components/schemas/ProductService' }
            inventory_item: { type: object, additionalProperties: true }
            link_status: { type: string, enum: [linked] }
    ProductServiceCreateRequest:
      type: object
