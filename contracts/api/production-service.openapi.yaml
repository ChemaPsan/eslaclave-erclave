      in: header
      required: true
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Search:
      name: q
      in: query
      schema:
        type: string
    Status:
      name: status
      in: query
      schema:
        type: string
  responses:
    Conflict:
      description: Conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    WarehouseMaterialLine:
      properties:
        id:
          title: Id
          type: string
        item_code:
          title: Item Code
          type: string
        item_name:
          title: Item Name
          type: string
        quantity:
          title: Quantity
          type: number
        unit_code:
          title: Unit Code
          type: string
        issued:
          title: Issued
          type: boolean
        allocations:
          items:
            additionalProperties: true
            type: object
          title: Allocations
          type: array
      required:
      - id
      - item_code
      - item_name
      - quantity
      - unit_code
      - issued
