      type: object
    WarehouseMaterialPage:
      properties:
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
        has_more:
          title: Has More
          type: boolean
      required:
      - limit
      - offset
      - has_more
      title: WarehouseMaterialPage
      type: object
    WarehouseMaterialRead:
      properties:
        id:
          title: Id
          type: string
        order_code:
          title: Order Code
          type: string
        responsible_name:
          title: Responsible Name
          type: string
        status:
          enum:
          - reserved
