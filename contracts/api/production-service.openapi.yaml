components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Search:
      name: q
      in: query
      schema:
        type: string
    Status:
      name: status
      in: query
      schema:
        type: string
  responses:
    Conflict:
      description: Conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ServiceEvidenceFileRequest:
      properties:
        filename:
          type: string
          maxLength: 180
          minLength: 1
          title: Filename
        content_base64:
          type: string
          maxLength: 6990508
          minLength: 1
          title: Content Base64
      additionalProperties: false
      type: object
      required:
      - filename
      - content_base64
      title: ServiceEvidenceFileRequest
    ProductionSalesRequestCreate:
      properties:
        sales_order_id:
          type: string
          maxLength: 40
          minLength: 1
          title: Sales Order Id
        sales_order_line_id:
          type: string
          maxLength: 40
          minLength: 1
          title: Sales Order Line Id
        product_service_id:
          type: string
          maxLength: 40
          minLength: 1
          title: Product Service Id
        quantity:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,12}|(?=[\d.]{1,19}0*$)\d{0,12}\.\d{0,6}0*$)
          title: Quantity
        unit:
          type: string
          maxLength: 40
          minLength: 1
          title: Unit
        requested_due_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Requested Due Date
      additionalProperties: false
      type: object
      required:
      - sales_order_id
      - sales_order_line_id
      - product_service_id
      - quantity
      - unit
      title: ProductionSalesRequestCreate
    ProductionReservationContextResponse:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/ProductionReservationContextRead'
          - type: 'null'
      type: object
      title: ProductionReservationContextResponse
    ProductionReservationContextRead:
      properties:
        order_id:
          type: string
          title: Order Id
        organization_context:
          $ref: '#/components/schemas/OperationalContext'
        allocation:
          $ref: '#/components/schemas/CreationAllocationRead'
      type: object
      required:
      - order_id
      - organization_context
      - allocation
      title: ProductionReservationContextRead
    OperationalContext:
      properties:
        cost_currency:
          anyOf:
          - type: string
            pattern: ^[A-Z]{3}$
