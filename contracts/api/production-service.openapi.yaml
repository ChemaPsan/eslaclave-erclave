openapi: 3.1.0
info:
  title: ERClave Production Service API
  version: 0.2.0
  summary: Product, recipe, production order and machine APIs; labor catalogs belong to hr-service.
servers:
- url: https://api.eslaclave.com
security:
- bearerAuth: []
tags:
- name: ProductServices
- name: Recipes
- name: Orders
- name: Machines
paths:
  /v1/production/orders/{order_id}/service-evidence/{phase}:
    post:
      x-required-module: production
      x-permissions:
      - production.order.start
      - production.order.wait_resources
      - production.order_stage.complete
      operationId: saveProductionServiceEvidence
      summary: Record immutable service start or finish evidence
      description: Only service recipes. Start requires production.order.start or production.order.wait_resources;
        finish requires production.order_stage.complete. Written description is required;
        up to three optional attachments. Retry with identical content returns the recorded
        evidence. All attachments expire 365 days after upload; written evidence remains.
        Images are normalized to metadata-free WebP <=307200 bytes, documents <=2097152
        bytes.
      parameters:
      - &id001
        name: order_id
        in: path
        required: true
        schema:
          type: string
      - &id002
        name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
      - name: phase
        in: path
        required: true
        schema:
          type: string
          enum:
          - start
          - finish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceEvidenceRequest'
      responses:
        '200':
          description: Written evidence and metadata only; never attachment bytes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceEvidenceRead'
        '403':
          description: Permission denied
        '409':
          description: Product order, terminal order, missing start evidence or differing
            immutable evidence
        '413':
          description: Request exceeds 21 MiB
        '422':
          description: Invalid description, file format or file limits
  /v1/production/orders/{order_id}/service-evidence/files/{file_id}:
    get:
      x-required-module: production
      x-permissions:
      - production.order.read
      operationId: downloadProductionServiceEvidence
      summary: Download private unexpired evidence
      description: Requires production.order.read and matching tenant. No public URL
        or caching. Expired files are unavailable even before physical cleanup.
      parameters:
      - *id001
      - *id002
      - name: file_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Attachment
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Permission denied
        '404':
          description: Not found for tenant/order
        '410':
          description: Retention expired
  /v1/production/warehouse-material-requests:
    get:
      tags:
      - Orders
      operationId: listProductionWarehouseMaterials
      summary: Pending production material issues, minimal tenant-scoped warehouse projection.
      x-required-module: production
      x-required-modules:
      - production
      - inventory
      x-permissions: [inventory.movement.read]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: limit
        in: query
        schema:
          type: integer
          default: 25
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      responses:
        '200':
          description: Pending issues with limit/offset pagination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseMaterialListResponse'
        '403':
          description: Permission, tenant or module denied.
        '409':
          description: Invalid state, missing reservations or competing command.
  /v1/production/orders/{order_id}/issue-materials:
    post:
      tags:
      - Orders
      operationId: issueProductionWarehouseMaterials
      summary: Warehouse confirms complete material issue before product or service production starts.
      x-required-module: production
      x-required-modules:
      - production
      - inventory
      x-permissions: [inventory.movement.create]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Durable issue result; needs_reconciliation remains retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseMaterialResponse'
        '403':
          description: Permission, tenant or module denied.
        '409':
          description: Invalid state, missing reservations or competing command.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseIssueRequest'
      description: No business payload. Stable order/reservation keys recover crashes and repeated calls without duplicate movements. Starting/resuming
        never consumes. Issuance does not change order status. Actor and designated order owner are audited.
  /v1/production/reports/{report_code}/export:
    get:
      tags:
      - Reports
      operationId: exportProductionStandardReport
      summary: Export a fixed Production report as UTF-8 CSV.
      x-required-module: production
      x-permissions: [production.product_service.read, production.recipe.read, production.order.read, production.machine.read]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: report_code
        in: path
        required: true
        schema:
          type: string
      - name: lang
        in: query
        schema:
          type: string
          enum:
          - es
          - en
          default: es
      - name: date_from
        in: query
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        schema:
          type: string
          format: date
      - name: status
        in: query
        schema:
          type: string
      - name: priority
        in: query
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
          maxLength: 120
      - name: product_id
        in: query
        schema:
          type: string
      - name: area_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: CSV export.
        '204':
          description: No rows matched the filters.
  /v1/production/product-services:
    get:
      tags:
      - ProductServices
      operationId: listProductServices
      summary: Search product and service catalog.
      x-required-module: production
      x-permissions: [production.product_service.read, sales.order.create, sales.order.fulfill, sales.quote.create, sales.quote.update]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/Status'
      - name: type
        in: query
        schema:
          type: string
          enum:
          - product
          - service
      - name: inventory_mapping
        in: query
        description: Filter products by authoritative Inventory mapping state.
        schema:
          type: string
          enum:
          - missing
          - linked
      responses:
        '200':
          description: Product services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductServiceListResponse'
    post:
      tags:
      - ProductServices
      operationId: createProductService
      summary: Create product or service.
      x-required-module: production
      x-permissions: [production.product_service.create]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductServiceCreateRequest'
      responses:
        '201':
          description: Product service created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductServiceResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/production/product-services/{id}:
    get:
      tags:
      - ProductServices
      operationId: getProductService
      summary: Get product or service detail.
      x-required-module: production
      x-permissions: [production.product_service.read, sales.order.create, sales.order.fulfill, sales.quote.create, sales.quote.update]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Product service detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductServiceResponse'
    patch:
      tags:
      - ProductServices
      operationId: updateProductService
      summary: Update product or service.
      x-required-module: production
      x-permissions: [production.product_service.update]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductServiceUpdateRequest'
      responses:
        '200':
          description: Product service updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductServiceResponse'
  /v1/production/product-services/{id}/status:
    patch:
      tags:
      - ProductServices
      operationId: updateProductServiceStatus
      summary: Change product or service status.
      x-required-module: production
      x-permissions: [production.product_service.status.update]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
      responses:
        '200':
          description: Status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductServiceResponse'
  /v1/production/product-services/{id}/finished-good-link:
    put:
      tags:
      - ProductServices
      operationId: createAndLinkFinishedGood
      summary: Create an Inventory finished good and link it to an active Production product.
      x-required-module: production
      x-permissions: [inventory.item.create, production.product_service.update]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishedGoodLinkRequest'
      responses:
        '200':
          description: Article created and linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishedGoodLinkResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/production/product-services/{id}/cost-summary:
    get:
      tags:
      - ProductServices
      operationId: getProductServiceCostSummary
      summary: Get standard cost summary from approved recipe.
      x-required-module: production
      x-permissions: [production.product_service.read]
      x-implementation-status: planned
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Cost summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostSummaryResponse'
  /v1/production/recipes:
    get:
      tags:
      - Recipes
      operationId: listRecipes
      summary: Search recipes.
      x-required-module: production
      x-permissions: [production.recipe.read]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Recipes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeListResponse'
    post:
      tags:
      - Recipes
      operationId: createRecipe
      summary: Create recipe for existing product or service.
      x-required-module: production
      x-permissions: [production.recipe.create]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeCreateRequest'
      responses:
        '201':
          description: Recipe created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
        '422':
          description: Product, unit, stage, or authoritative recipe resource is not eligible; machinery may be active or under maintenance but
            must exist and not be inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/production/recipes/{id}:
    get:
      tags:
      - Recipes
      operationId: getRecipe
      summary: Get recipe with versions.
      x-required-module: production
      x-permissions: [production.recipe.read]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Recipe detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
  /v1/production/recipes/{id}/versions:
    post:
      tags:
      - Recipes
      operationId: createRecipeVersion
      summary: Create new recipe version.
      x-required-module: production
      x-permissions: [production.recipe.update]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeVersionCreateRequest'
      responses:
        '201':
          description: Recipe version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeVersionResponse'
        '422':
          description: Product, unit, stage, or authoritative recipe resource is not eligible; machinery may be active or under maintenance but
            must exist and not be inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/production/recipe-versions/{version_id}:
    patch:
      tags:
      - Recipes
      operationId: updateRecipeVersion
      summary: Update draft recipe version.
      x-required-module: production
      x-permissions: [production.recipe.update]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: version_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeVersionUpdateRequest'
      responses:
        '200':
          description: Version updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeVersionResponse'
        '422':
          description: Product, unit, stage, or authoritative recipe resource is not eligible; machinery may be active or under maintenance but
            must exist and not be inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/production/recipe-versions/{version_id}/submit:
    post:
      tags:
      - Recipes
      operationId: submitRecipeVersion
      summary: Submit recipe version for approval.
      x-required-module: production
      x-permissions: [production.recipe.submit]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: version_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Version submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeVersionResponse'
  /v1/production/recipe-versions/{version_id}/approve:
    post:
      tags:
      - Recipes
      operationId: approveRecipeVersion
      summary: Approve recipe version as usable for new orders.
      x-required-module: production
      x-permissions: [production.recipe.approve]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: version_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Version approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeVersionResponse'
  /v1/production/recipe-versions/{version_id}/obsolete:
    post:
      tags:
      - Recipes
      operationId: obsoleteRecipeVersion
      summary: Mark recipe version obsolete.
      x-required-module: production
      x-permissions: [production.recipe.obsolete]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: version_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Version obsoleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeVersionResponse'
  /v1/production/resource-validations:
    post:
      tags:
      - Orders
      operationId: validateProductionResources
      summary: Validate resources before creating or releasing an order.
      x-required-module: production
      x-permissions: [production.order.validate]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceValidationRequest'
      responses:
        '200':
          description: Resource validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceValidationResponse'
  /v1/production/orders:
    get:
      tags:
      - Orders
      operationId: listProductionOrders
      summary: List Orders
      x-required-module: production
      x-permissions: [production.order.read]
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '409':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '503':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
      x-implementation-status: implemented
    post:
      tags:
      - Orders
      operationId: createProductionOrder
      summary: Create Order
      x-required-module: production
      x-permissions: [production.order.release]
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant-Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionOrderCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '409':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
        '503':
          description: Authorization, workflow precondition, or recoverable dependency error; use error.code and details.
      x-implementation-status: implemented
      description: HR and resource validation precede creation. Failed creation records a recovery owned by its actor; rollback releases only
        that failed source and prevents late reservation writes.
  /v1/production/finished-goods-candidates:
    get:
      tags:
      - Orders
      operationId: listFinishedGoodsCandidates
      summary: List the minimum completed-order projection needed for Inventory receipt.
      x-required-module: production
      x-permissions: [inventory.finished_goods_receipt.read, inventory.finished_goods_receipt.receive]
      x-permission-mode: any
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Minimal finished-goods receipt candidates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishedGoodsCandidateListResponse'
  /v1/production/finished-goods-candidates/{id}:
    get:
      tags:
      - Orders
      operationId: getFinishedGoodsCandidate
      summary: Get one minimum completed-order projection for Inventory validation.
      x-required-module: production
      x-permissions: [inventory.finished_goods_receipt.read, inventory.finished_goods_receipt.receive]
      x-permission-mode: any
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Minimal finished-goods receipt candidate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishedGoodsCandidateResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/production/order-requests:
    get:
      tags:
      - Orders
      operationId: listProductionOrderRequests
      summary: List authoritative Sales requests awaiting Production planning.
      x-implementation-status: implemented
      x-required-module: production
      x-permissions: [production.order.read]
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending_configuration
          - converted
          - cancelled
      responses:
        '200':
          description: Production requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionSalesRequestListResponse'
    post:
      tags:
      - Orders
      operationId: createProductionOrderRequest
      summary: Register an authoritative Sales request without releasing a Production order.
      x-implementation-status: implemented
      x-required-module: production
      x-permissions: [sales.order.fulfill]
      parameters:
