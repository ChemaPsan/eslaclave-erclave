openapi: 3.1.0
x-implementation-status: implemented
info:
  title: ERClave Sales Service API
  version: 0.6.0
  summary: Corte Local autoritativo de Clientes, Cotizaciones, Pedidos, Ordenes de servicio, surtido y Entregas.
servers: [{ url: 'http://127.0.0.1:8008' }]
security: [{ bearerAuth: [] }]
paths:
  /v1/sales/reports/{report_code}/export:
    get:
      tags: [Reports]
      operationId: exportSalesStandardReport
      summary: Export a fixed Sales report as UTF-8 CSV.
      x-required-module: sales
      x-permissions: [sales.customer.read, sales.quote.read, sales.order.read, sales.delivery.read, sales.service_order.read]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: report_code, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, schema: { type: string, enum: [es, en], default: es } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: customer_id, in: query, schema: { type: string } }
        - { name: responsible_worker_id, in: query, schema: { type: string } }
        - { name: product_service_id, in: query, schema: { type: string } }
      responses:
        '200': { description: CSV export. }
        '204': { description: No rows matched the filters. }
  /v1/sales/reference-data:
    get:
      operationId: getSalesReferenceData
      x-required-module: sales
      x-permissions: [sales.customer.read, sales.customer.create, sales.customer.update, sales.quote.read, sales.quote.create, sales.quote.update, sales.order.read, sales.order.create]
      x-permission-mode: any
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      responses: { '200': { description: Monedas y condiciones de pago versionadas., content: { application/json: { schema: { $ref: '#/components/schemas/SalesReferenceDataResponse' } } } } }
  /v1/sales/customers:
    get:
      operationId: listCustomers
      x-required-module: sales
      x-permissions: [sales.customer.read]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { name: status, in: query, schema: { type: string, enum: [prospect, active, inactive, blocked] } }, { name: q, in: query, schema: { type: string, maxLength: 120 } }]
      responses: { '200': { description: Clientes del tenant., content: { application/json: { schema: { $ref: '#/components/schemas/CustomerListResponse' } } } } }
    post:
      operationId: createCustomer
      x-required-module: sales
      x-permissions: [sales.customer.create]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerCreateRequest' } } } }
      responses: { '201': { description: Cliente creado., content: { application/json: { schema: { $ref: '#/components/schemas/CustomerResponse' } } } } }
  /v1/sales/customers/{id}:
    get:
      operationId: getCustomer
      x-required-module: sales
      x-permissions: [sales.customer.read]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: Cliente., content: { application/json: { schema: { $ref: '#/components/schemas/CustomerResponse' } } } } }
    patch:
      operationId: updateCustomer
      x-required-module: sales
      x-permissions: [sales.customer.update]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IdPath' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerUpdateRequest' } } } }
      responses: { '200': { description: Cliente actualizado., content: { application/json: { schema: { $ref: '#/components/schemas/CustomerResponse' } } } } }
  /v1/sales/quotes:
    get:
      operationId: listQuotes
      x-required-module: sales
      x-permissions: [sales.quote.read]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { name: status, in: query, schema: { type: string, enum: [draft, quoted, approved, expired, cancelled] } }, { name: customer_id, in: query, schema: { type: string } }]
      responses: { '200': { description: Cotizaciones del tenant., content: { application/json: { schema: { $ref: '#/components/schemas/QuoteListResponse' } } } } }
    post:
      operationId: createQuote
      x-required-module: sales
      x-permissions: [sales.quote.create]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteCreateRequest' } } } }
      responses: { '201': { description: Cotización calculada y creada como borrador., content: { application/json: { schema: { $ref: '#/components/schemas/QuoteResponse' } } } } }
  /v1/sales/quotes/{id}:
    get:
      operationId: getQuote
      x-required-module: sales
      x-permissions: [sales.quote.read]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: Cotización., content: { application/json: { schema: { $ref: '#/components/schemas/QuoteResponse' } } } } }
    patch:
      operationId: updateQuote
      x-required-module: sales
      x-permissions: [sales.quote.update]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IdPath' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteUpdateRequest' } } } }
      responses: { '200': { description: Borrador recalculado., content: { application/json: { schema: { $ref: '#/components/schemas/QuoteResponse' } } } } }
  /v1/sales/quotes/{id}/submit:
    post: { operationId: submitQuote, x-required-module: sales, x-permissions: [sales.quote.submit], parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IdPath' }], responses: { '200': { description: Cotización emitida., content: { application/json: { schema: { $ref: '#/components/schemas/QuoteResponse' } } } } } }
  /v1/sales/quotes/{id}/approve:
    post: { operationId: approveQuote, x-required-module: sales, x-permissions: [sales.quote.approve], parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IdPath' }], responses: { '200': { description: Cotización aprobada., content: { application/json: { schema: { $ref: '#/components/schemas/QuoteResponse' } } } } } }
  /v1/sales/quotes/{id}/expire:
    post: { operationId: expireQuote, x-required-module: sales, x-permissions: [sales.quote.expire], parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IdPath' }], responses: { '200': { description: Cotización expirada., content: { application/json: { schema: { $ref: '#/components/schemas/QuoteResponse' } } } } } }
  /v1/sales/quotes/{id}/cancel:
    post: { operationId: cancelQuote, x-required-module: sales, x-permissions: [sales.quote.cancel], parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IdPath' }], responses: { '200': { description: Cotización cancelada., content: { application/json: { schema: { $ref: '#/components/schemas/QuoteResponse' } } } } } }
  /v1/sales/orders:
    get:
      operationId: listSalesOrders
      x-required-module: sales
      x-permissions: [sales.order.read]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { name: status, in: query, schema: { type: string } }, { name: customer_id, in: query, schema: { type: string } }]
      responses: { '200': { description: Sales orders., content: { application/json: { schema: { $ref: '#/components/schemas/SalesOrderListResponse' } } } } }
    post:
      operationId: createSalesOrder
      x-required-module: sales
      x-permissions: [sales.order.create]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SalesOrderCreateRequest' } } } }
      responses: { '201': { description: Approved quote converted once to a sales order., content: { application/json: { schema: { $ref: '#/components/schemas/SalesOrderResponse' } } } } }
  /v1/sales/orders/{id}:
    get:
      operationId: getSalesOrder
      x-required-module: sales
      x-permissions: [sales.order.read]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: Sales order., content: { application/json: { schema: { $ref: '#/components/schemas/SalesOrderResponse' } } } } }
  /v1/sales/orders/{id}/fulfillment:
    post:
      operationId: configureSalesOrderFulfillment
      x-required-module: sales
      x-permissions: [sales.order.fulfill]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IdPath' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SalesOrderFulfillmentRequest' } } } }
      responses: { '200': { description: Inventory reservations or Production requests configured., content: { application/json: { schema: { $ref: '#/components/schemas/SalesOrderResponse' } } } } }
  /v1/sales/orders/{id}/cancel:
    post:
      operationId: cancelSalesOrder
      x-required-module: sales
      x-permissions: [sales.order.cancel]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IdPath' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActionReasonRequest' } } } }
      responses: { '200': { description: Sales order cancelled and active reservations released., content: { application/json: { schema: { $ref: '#/components/schemas/SalesOrderResponse' } } } } }
  /v1/sales/service-orders:
    get:
      operationId: listSalesServiceOrders
      x-required-module: sales
      x-permissions: [sales.service_order.read]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, {name: status, in: query, schema: {type: string, enum: [draft, planned, assigned, in_progress, on_hold, pending_acceptance, accepted, cancelled]}}, {name: order_id, in: query, schema: {type: string}}, {name: customer_id, in: query, schema: {type: string}}]
      responses: {'200': {description: Ordenes de servicio del tenant., content: {application/json: {schema: {$ref: '#/components/schemas/ServiceOrderListResponse'}}}}}
  /v1/sales/service-orders/{id}:
    get:
      operationId: getSalesServiceOrder
      x-required-module: sales
      x-permissions: [sales.service_order.read]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdPath' }]
      responses: {'200': {description: Orden de servicio., content: {application/json: {schema: {$ref: '#/components/schemas/ServiceOrderResponse'}}}}}
  /v1/sales/service-orders/{id}/plan:
    post:
      operationId: planSalesServiceOrder
      x-required-module: sales
      x-permissions: [sales.service_order.plan]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IdPath' }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceOrderPlanRequest'}}}}
      responses: {'200': {description: Orden de servicio planeada., content: {application/json: {schema: {$ref: '#/components/schemas/ServiceOrderResponse'}}}}}
  /v1/sales/service-orders/{id}/time-entries:
    post:
      operationId: createSalesServiceTimeEntry
      x-required-module: sales
      x-permissions: [sales.service_order.time.create]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IdPath' }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceTimeEntryCreateRequest'}}}}
      responses: {'201': {description: Tiempo trazable agregado., content: {application/json: {schema: {$ref: '#/components/schemas/ServiceOrderResponse'}}}}}
  /v1/sales/service-orders/{id}/cost-entries:
    post:
      operationId: createSalesServiceCostEntry
      x-required-module: sales
      x-permissions: [sales.service_order.cost.create]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IdPath' }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceCostEntryCreateRequest'}}}}
      responses: {'201': {description: Costo trazable agregado., content: {application/json: {schema: {$ref: '#/components/schemas/ServiceOrderResponse'}}}}}
  /v1/sales/service-orders/{id}/evidence:
    post:
      operationId: createSalesServiceEvidence
      x-required-module: sales
      x-permissions: [sales.service_order.evidence.create]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IdPath' }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceEvidenceCreateRequest'}}}}
      responses: {'201': {description: Evidencia trazable agregada., content: {application/json: {schema: {$ref: '#/components/schemas/ServiceOrderResponse'}}}}}
  /v1/sales/service-orders/{id}/transitions/{action}:
    post:
      operationId: transitionSalesServiceOrder
      x-required-module: sales
      x-permissions: [sales.service_order.assign, sales.service_order.start, sales.service_order.wait, sales.service_order.resume, sales.service_order.submit_acceptance, sales.service_order.accept, sales.service_order.cancel]
      x-permission-mode: action-derived
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IdPath' }, {name: action, in: path, required: true, schema: {type: string, enum: [assign, start, wait, resume, submit_acceptance, accept, cancel]}}]
      requestBody: {required: true, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ServiceOrderAssignRequest'}, {$ref: '#/components/schemas/ServiceOrderTransitionRequest'}]}}}}
      responses: {'200': {description: Transicion auditada de la orden de servicio., content: {application/json: {schema: {$ref: '#/components/schemas/ServiceOrderResponse'}}}}}
  /v1/sales/deliveries:
    get:
      operationId: listSalesDeliveries
      x-required-module: sales
      x-permissions: [sales.delivery.read]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { name: status, in: query, schema: { type: string } }, { name: order_id, in: query, schema: { type: string } }]
      responses: { '200': { description: Deliveries., content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryListResponse' } } } } }
    post:
      operationId: createSalesDelivery
      x-required-module: sales
      x-permissions: [sales.delivery.create]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryCreateRequest' } } } }
      responses: { '201': { description: Draft full or partial delivery., content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryResponse' } } } } }
  /v1/sales/deliveries/{id}:
    get:
      operationId: getSalesDelivery
      x-required-module: sales
      x-permissions: [sales.delivery.read]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: Delivery., content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryResponse' } } } } }
  /v1/sales/deliveries/{id}/confirm:
    post:
      operationId: confirmSalesDelivery
      x-required-module: sales
      x-permissions: [sales.delivery.confirm]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IdPath' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActionReasonRequest' } } } }
      responses: { '200': { description: Delivery confirmed, reservations consumed and actual cost recalculated., content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryResponse' } } } } }
  /v1/sales/deliveries/{id}/cancel:
    post:
      operationId: cancelSalesDelivery
      x-required-module: sales
      x-permissions: [sales.delivery.cancel]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IdPath' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActionReasonRequest' } } } }
      responses: { '200': { description: Draft delivery cancelled., content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryResponse' } } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    TenantHeader: { name: X-Tenant-Id, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8 } }
    IdPath: { name: id, in: path, required: true, schema: { type: string } }
  schemas:
    ContactInput: { type: object, required: [name, email, phone], properties: { name: { type: string }, email: { type: string, format: email }, phone: { type: string }, role: { type: [string, 'null'] } } }
    CustomerCreateRequest:
      type: object
      required: [code, commercial_name, customer_type, responsible_worker_id, primary_contact, payment_terms]
      properties: { code: { type: string }, commercial_name: { type: string }, customer_type: { type: string, enum: [company, individual, government, internal] }, status: { type: string, enum: [prospect, active, inactive, blocked] }, responsible_worker_id: { type: string }, primary_contact: { $ref: '#/components/schemas/ContactInput' }, payment_terms: { type: string }, currency: { type: string }, legal_name: { type: [string, 'null'] }, tax_id: { type: [string, 'null'] }, billing_email: { type: [string, 'null'] } }
    CustomerUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        commercial_name: {type: [string, 'null'], minLength: 1, maxLength: 200}
        customer_type: {type: [string, 'null'], enum: [company, individual, government, internal, null]}
        status: {type: [string, 'null'], enum: [prospect, active, inactive, blocked, null]}
        responsible_worker_id: {type: [string, 'null'], minLength: 1, maxLength: 40}
        primary_contact: {oneOf: [{$ref: '#/components/schemas/ContactInput'}, {type: 'null'}]}
        payment_terms: {type: [string, 'null']}
        currency: {type: [string, 'null']}
        credit_limit: {type: [number, 'null'], minimum: 0}
        legal_name: {type: [string, 'null'], maxLength: 240}
        tax_id: {type: [string, 'null'], maxLength: 20}
        tax_regime: {type: [string, 'null'], maxLength: 120}
        cfdi_use: {type: [string, 'null'], maxLength: 10}
        billing_email: {type: [string, 'null'], format: email}
        billing_phone: {type: [string, 'null'], maxLength: 30}
        billing_address: {oneOf: [{$ref: '#/components/schemas/BillingAddress'}, {type: 'null'}]}
        notes: {type: [string, 'null'], maxLength: 2000}
    QuoteLineInput: { type: object, required: [product_service_id, quantity, unit, unit_price], properties: { product_service_id: { type: string }, quantity: { type: number, exclusiveMinimum: 0 }, unit: { type: string }, unit_price: { type: number, minimum: 0 }, discount_percentage: { type: number, minimum: 0, maximum: 100 } } }
    QuoteCreateRequest: { type: object, required: [code, customer_id, valid_until, lines], properties: { code: { $ref: '#/components/schemas/BusinessDocumentCode' }, customer_id: { type: string }, responsible_worker_id: { type: [string, 'null'] }, currency: { type: [string, 'null'] }, payment_terms: { type: [string, 'null'] }, valid_until: { type: string, format: date }, promised_delivery_date: { type: [string, 'null'] }, lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/QuoteLineInput' } } } }
    QuoteUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        customer_id: {type: [string, 'null'], minLength: 1, maxLength: 40}
        responsible_worker_id: {type: [string, 'null'], minLength: 1, maxLength: 40}
        currency: {type: [string, 'null']}
        payment_terms: {type: [string, 'null']}
        valid_until: {type: [string, 'null'], format: date}
        promised_delivery_date: {type: [string, 'null'], format: date}
        notes: {type: [string, 'null'], maxLength: 2000}
        lines: {type: [array, 'null'], minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/QuoteLineInput'}}
    BillingAddress:
      type: object
      additionalProperties: false
      properties:
        street: {type: [string, 'null'], maxLength: 200}
        exterior_number: {type: [string, 'null'], maxLength: 40}
        interior_number: {type: [string, 'null'], maxLength: 40}
        neighborhood: {type: [string, 'null'], maxLength: 160}
        city: {type: [string, 'null'], maxLength: 120}
        state: {type: [string, 'null'], maxLength: 120}
        postal_code: {type: [string, 'null'], maxLength: 12}
        country: {type: [string, 'null'], maxLength: 80}
    ContactRead:
      allOf:
        - {$ref: '#/components/schemas/ContactInput'}
        - {type: object, required: [id, is_primary, status], properties: {id: {type: string}, is_primary: {type: boolean}, status: {type: string, enum: [active, inactive]}}}
    CustomerRead:
      type: object
      required: [id, code, commercial_name, customer_type, status, responsible_worker_id, responsible_worker_name, payment_terms, currency, credit_limit, contacts, created_at, updated_at]
      properties:
        id: {type: string}
        code: {type: string}
        commercial_name: {type: string}
        customer_type: {type: string, enum: [company, individual, government, internal]}
        status: {type: string, enum: [prospect, active, inactive, blocked]}
        responsible_worker_id: {type: string}
        responsible_worker_name: {type: string}
        payment_terms: {type: string}
        currency: {type: string}
        credit_limit: {type: number}
        legal_name: {type: [string, 'null']}
        tax_id: {type: [string, 'null']}
        tax_regime: {type: [string, 'null']}
        cfdi_use: {type: [string, 'null']}
        billing_email: {type: [string, 'null'], format: email}
        billing_phone: {type: [string, 'null']}
        billing_address: {oneOf: [{$ref: '#/components/schemas/BillingAddress'}, {type: 'null'}]}
        notes: {type: [string, 'null']}
        fulfillment_state: {type: string, enum: [idle, processing, completed, needs_reconciliation]}
        cancellation_state: {type: string, enum: [idle, processing, completed, needs_reconciliation]}
        contacts: {type: array, items: {$ref: '#/components/schemas/ContactRead'}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CustomerResponse: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/CustomerRead'}}}
    CustomerListResponse: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/CustomerRead'}}}}
    QuoteLineRead:
      type: object
      required: [id, line_number, product_service_id, product_service_code, product_service_name, product_service_type, unit, quantity, unit_price, discount_percentage, subtotal, discount_amount, total]
      properties:
        id: {type: string}
        line_number: {type: integer, minimum: 1}
        product_service_id: {type: string}
        product_service_code: {type: string}
        product_service_name: {type: string}
        product_service_type: {type: string, enum: [product, service]}
        unit: {type: string}
        quantity: {type: number, exclusiveMinimum: 0}
        unit_price: {type: number, minimum: 0}
        discount_percentage: {type: number, minimum: 0, maximum: 100}
        subtotal: {type: number, minimum: 0}
        discount_amount: {type: number, minimum: 0}
        total: {type: number, minimum: 0}
        standard_unit_cost_snapshot: {type: [number, 'null'], minimum: 0}
        estimated_cost: {type: [number, 'null'], minimum: 0}
    QuoteRead:
      type: object
