      responses: { '200': { description: Tenant PDF identity template updated. } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
      description: Tenant context. Must match authenticated actor.
    ActorHeader:
      name: X-Actor-Id
      in: header
      required: false
      schema:
        type: string
      description: Local/demo fallback only. QA/prod resolve the actor from the Firebase Auth bearer token.
    TenantIdPath:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
    ModuleCodePath:
      name: module_code
      in: path
      required: true
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        maximum: 200
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Status:
      name: status
      in: query
      required: false
      schema:
        type: string
    Search:
      name: q
      in: query
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CodeSequence:
      type: object
      required: [id, document_type, module_code, name_es, name_en, prefix, separator, next_number, padding, mode, system_default, status]
      properties:
        id: {type: string}
        document_type: {type: string, maxLength: 80}
        module_code: {type: string, maxLength: 40}
        name_es: {type: string, maxLength: 160}
        name_en: {type: string, maxLength: 160}
        prefix: {type: string, maxLength: 24}
        separator: {type: string, maxLength: 3}
        next_number: {type: integer, minimum: 1}
        padding: {type: integer, minimum: 1, maximum: 12}
        mode: {type: string, enum: [managed, manual]}
        system_default: {type: boolean}
        status: {type: string, enum: [active, inactive]}
    CodeSequenceUpdate:
      type: object
      properties:
        prefix: {type: string, minLength: 1, maxLength: 24, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}
        separator: {type: string, maxLength: 3, pattern: '^[._/-]*$'}
        next_number: {type: integer, minimum: 1}
        padding: {type: integer, minimum: 1, maximum: 12}
        mode: {type: string, enum: [managed, manual]}
        status: {type: string, enum: [active, inactive]}
    CodeSequenceNext:
      type: object
      properties:
        manual_code: {type: [string, 'null'], minLength: 1, maxLength: 60, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'}
    CodeSequenceAllocation:
      type: object
      required: [document_type, mode, code]
      properties:
        document_type: {type: string}
        mode: {type: string, enum: [managed, manual]}
        code: {type: string}
        sequence_number: {type: [integer, 'null']}
    CodeSequenceResponse:
      type: object
      required: [data]
      properties: {data: {$ref: '#/components/schemas/CodeSequence'}}
    CodeSequenceListResponse:
      type: object
      required: [data]
      properties: {data: {type: array, items: {$ref: '#/components/schemas/CodeSequence'}}}
    CodeSequenceAllocationResponse:
      type: object
      required: [data]
      properties: {data: {$ref: '#/components/schemas/CodeSequenceAllocation'}}
    UnitOfMeasure:
      type: object
      required: [id, code, name_es, name_en, symbol, category, decimal_places, system_default, status]
      properties:
        id: {type: string}
        code: {type: string, maxLength: 20}
        name_es: {type: string, maxLength: 120}
        name_en: {type: string, maxLength: 120}
        symbol: {type: string, maxLength: 24}
        category: {type: string, maxLength: 40}
        decimal_places: {type: integer, minimum: 0, maximum: 6}
        system_default: {type: boolean}
        status: {type: string, enum: [active, inactive]}
    UnitOfMeasureWrite:
      type: object
      required: [code, name_es, name_en, symbol, category]
      properties:
        code: {type: string, maxLength: 20}
        name_es: {type: string, maxLength: 120}
        name_en: {type: string, maxLength: 120}
        symbol: {type: string, maxLength: 24}
        category: {type: string, maxLength: 40}
        decimal_places: {type: integer, minimum: 0, maximum: 6}
    UnitOfMeasureUpdate:
      type: object
      properties:
        name_es: {type: string, minLength: 1, maxLength: 120}
        name_en: {type: string, minLength: 1, maxLength: 120}
        symbol: {type: string, minLength: 1, maxLength: 24}
        category: {type: string, minLength: 1, maxLength: 40}
        decimal_places: {type: integer, minimum: 0, maximum: 6}
        status: {type: string, enum: [active, inactive]}
    UnitOfMeasureResponse:
      type: object
      required: [data]
      properties: {data: {$ref: '#/components/schemas/UnitOfMeasure'}}
    UnitOfMeasureListResponse:
      type: object
      required: [data]
      properties: {data: {type: array, items: {$ref: '#/components/schemas/UnitOfMeasure'}}}
    SessionTenant:
      type: object
      required: [tenant, user_status, membership_status, roles]
      properties:
        tenant: {$ref: '#/components/schemas/Tenant'}
        user_status: {type: string}
        membership_status: {type: string}
        roles: {type: array, items: {type: string}}
    SessionTenantListResponse:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/SessionTenant'}}
        page: {$ref: '#/components/schemas/Page'}
    BackofficeTenant:
      allOf:
        - $ref: '#/components/schemas/Tenant'
        - type: object
          properties:
            owner_email: {type: [string, 'null']}
            active_memberships: {type: integer}
            total_memberships: {type: integer}
            modules: {type: array, items: {type: string}}
            entitlements: {type: array, items: {$ref: '#/components/schemas/Entitlement'}}
            legal_entities_count: {type: integer}
            branches_count: {type: integer}
    BackofficeTenantListResponse:
      type: object
      required: [data]
      properties: {data: {type: array, items: {$ref: '#/components/schemas/BackofficeTenant'}}}
    BackofficeTenantStatusRequest:
      type: object
      required: [status]
      properties: {status: {type: string, enum: [active, suspended]}}
    BackofficeTenantUpdateRequest:
      type: object
      properties:
        commercial_name: {type: string, minLength: 1, maxLength: 240}
        legal_name: {type: [string, 'null'], maxLength: 240}
        plan_id: {type: [string, 'null'], maxLength: 40}
        timezone: {type: string, minLength: 1, maxLength: 80}
        locale: {type: string, minLength: 2, maxLength: 20}
    BackofficeEntitlementUpdateRequest:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [active, inactive, suspended]}
        limits: {type: object, additionalProperties: true}
        source: {type: string, enum: [subscription, manual, trial], default: manual}
    ModuleCatalog:
      type: object
      required: [code, name, description, owner_service, public_feature, implementation_status, dependencies]
      properties:
        code: {type: string}
        name: {type: string}
        description: {type: string}
        owner_service: {type: string}
        public_feature: {type: boolean}
        implementation_status: {type: string, enum: [implemented, planned]}
        dependencies: {type: array, items: {type: string}}
    ModuleCatalogListResponse:
      type: object
      required: [data]
      properties: {data: {type: array, items: {$ref: '#/components/schemas/ModuleCatalog'}}}
    BackofficeTenantDeleteResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/BackofficeTenantDeleteResult'
    BackofficeTenantDeleteResult:
      type: object
      required: [tenant, deleted, removed_memberships, removed_global_users, firebase_identity_cleanup]
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        deleted:
          type: boolean
        removed_memberships:
          type: integer
          minimum: 0
        removed_global_users:
          type: integer
          minimum: 0
        firebase_identity_cleanup:
          $ref: '#/components/schemas/FirebaseIdentityCleanup'
    FirebaseIdentityCleanup:
      type: object
      required: [status, requested, failed, error_codes]
      properties:
        status:
          type: string
          enum: [completed, pending]
        requested:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        error_codes:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlation_id]
          properties:
            code:
              type: string
            message:
              type: string
            correlation_id:
              type: string
            details:
              type: object
              additionalProperties: true
    Page:
      type: object
      properties:
        limit:
          type: integer
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
    Tenant:
      type: object
      required: [id, slug, commercial_name, status]
      properties:
