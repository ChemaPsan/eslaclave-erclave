          type: integer
          enum: [1]
          description: Version del contrato de disponibilidad; no es un permiso ni prueba de configuracion contable.
        capabilities:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CapabilityAvailability'
        cost_center_requirement:
          type: string
          enum: [enabled_imputation_flows]
          description: Centro obligatorio solo en flujos de imputacion habilitados; no exige capturar centros por preparar el sistema.
        scope:
          $ref: '#/components/schemas/SessionScope'
    CapabilityAvailability:
      type: object
      required: [owner_service, availability_module, implemented, available, reason]
      properties:
        owner_service:
          type: string
        availability_module:
          type: string
        implemented:
          type: boolean
        available:
          type: boolean
          description: Disponibilidad tecnica y del tenant, no autorizacion de una accion ni configuracion lista. Cada consumidor revalida permiso y alcance.
        reason:
          type: string
          enum: [available, not_implemented, module_inactive, identity_inactive]
    SessionBranch:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        status:
          type: string
        legal_entity_id:
          type: string
    SessionScope:
      $ref: '#/components/schemas/SessionScopeRead'
    SessionContextResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SessionContext'
    EntitlementPreferenceUpdateRequest:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
    PolicyEvaluateRequest:
      type: object
      required: [tenant_id, actor_id, module, resource, action]
      properties:
        tenant_id:
          type: string
        actor_id:
          type: string
        module:
          type: string
        resource:
          type: string
        action:
          type: string
        scope:
          type: object
          additionalProperties: true
    PolicyEvaluateResponse:
      type: object
      properties:
        data:
          type: object
          required: [allowed]
          properties:
            allowed:
              type: boolean
            reason:
              type: string
            matched_permissions:
              type: array
              items:
                type: string
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [invited, active, disabled, deleted]
        roles:
          type: array
          items:
            type: string
    UserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'
    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/Page'
    UserInvitationRequest:
      type: object
      required: [email, display_name, role_ids]
      properties:
        email:
          type: string
        display_name:
          type: string
        role_ids:
          type: array
          items:
            type: string
    UserUpdateRequest:
      type: object
      properties:
        display_name:
          type: string
        role_ids:
          type: array
          items:
            type: string
    Role:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        status:
          type: string
        permissions:
          type: array
          items:
            type: string
        permission_assignments:
          type: array
          items:
            $ref: '#/components/schemas/PermissionAssignment'
        system_role:
          type: boolean
        permission_revision:
          type: integer
          minimum: 1
    RoleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Role'
    RoleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        page:
          $ref: '#/components/schemas/Page'
    RoleCreateRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
    RoleUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
    RolePermissionsReplaceRequest:
      type: object
      properties:
        assignments:
          type: array
          description: Preferred representation. Requires expected_revision.
          items:
            $ref: '#/components/schemas/PermissionAssignmentInput'
        expected_revision:
          type: integer
          minimum: 1
        permission_ids:
          type: array
          deprecated: true
          description: Legacy representation retained for compatible clients; cannot be combined with assignments.
          items:
            type: string
        scope:
          type: object
          deprecated: true
          description: Legacy shared scope used only with permission_ids.
          additionalProperties: true
    PermissionAssignmentInput:
      type: object
      required: [permission_id]
      properties:
        permission_id:
          type: string
        scope:
          type: object
          description: Opaque existing scope must be sent unchanged; new assignments currently require an empty object.
          additionalProperties: true
    PermissionAssignment:
      allOf:
        - $ref: '#/components/schemas/PermissionAssignmentInput'
        - type: object
          required: [code]
          properties:
            code:
              type: string
    Permission:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        module_code:
          type: string
        resource:
          type: string
        action:
          type: string
        status:
          type: string
        display_name_es:
          type: string
        display_name_en:
          type: string
        description_es:
          type: string
        description_en:
          type: string
        classification:
          type: string
          enum: [tenant, internal, public, integration]
        assignable_to_tenant_role:
          type: boolean
        risk_level:
          type: string
          enum: [low, standard, high, critical]
        sort_order:
          type: integer
        entitlement_status:
          type: string
          nullable: true
          enum: [active, inactive, suspended]
        available:
          type: boolean
    PermissionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        page:
          $ref: '#/components/schemas/Page'
    BusinessUnit:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        status:
          type: string
    BusinessUnitResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BusinessUnit'
    BusinessUnitListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BusinessUnit'
    BusinessUnitCreateRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    Setting:
      type: object
      description: Tenant setting. `organization.profile` is the canonical key for corporate, legal entities and branches configured in Administration.
      properties:
        key:
          type: string
        module_code:
          type: string
        value:
          type: object
          additionalProperties: true
    SettingResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Setting'
    SettingListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Setting'
    SettingUpsertRequest:
      type: object
      required: [value]
      properties:
        module_code:
          type: string
        value:
          type: object
          additionalProperties: true
          description: For key `organization.profile`, this value must match `OrganizationProfile`.
    OrganizationItemResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
    LegalEntityCreateRequest:
      type: object
      required: [legal_name]
      properties:
        legal_name:
          type: string
        tax_id:
          type: string
        fiscal_regime:
          type: string
        cfdi_usage:
          type: string
        fiscal_address:
          type: string
        contact_name:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
        contact_position:
          type: string
    LegalEntityUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/LegalEntityCreateRequest'
      required: []
    BranchCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        code:
          type: string
        legal_entity_id:
          type: string
        address:
          type: string
        phone:
          type: string
    BranchUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/BranchCreateRequest'
      required: []
    OrganizationProfile:
      type: object
      required: [corporate, legal_entities, branches]
      properties:
        corporate:
          $ref: '#/components/schemas/CorporateProfile'
        legal_entities:
          type: array
          items:
            $ref: '#/components/schemas/LegalEntityProfile'
        branches:
          type: array
          items:
            $ref: '#/components/schemas/BranchProfile'
    CorporateProfile:
      type: object
      required: [commercial_name]
      properties:
        commercial_name:
          type: string
        legal_name:
          type: string
        tax_id:
          type: string
        phone:
          type: string
        contact_name:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
        contact_position:
          type: string
    LegalEntityProfile:
      type: object
      required: [id, legal_name]
      properties:
        id:
          type: string
        legal_name:
          type: string
        tax_id:
          type: string
        fiscal_regime:
          type: string
        cfdi_usage:
          type: string
        fiscal_address:
          type: string
        contact_name:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
        contact_position:
          type: string
    BranchProfile:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        legal_entity_id:
          type: string
        address:
          type: string
        phone:
          type: string

x-transport-policy:
  implementation-status: local-only
  operation-budget-seconds: 25
  budget-enforcement: cooperative-http-steps-not-database-cancellation
  request-budget-header: X-Request-Timeout-Ms
  request-budget-unit: milliseconds
  request-budget-rule: optional-positive-finite-value-can-only-reduce-budget
  correlation-header: X-Correlation-Id
  error-dependency-field: error.details.dependency_service
  automatic-retries: false
