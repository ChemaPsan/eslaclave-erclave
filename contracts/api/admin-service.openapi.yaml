components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
      description: Tenant context. Must match authenticated actor.
    ActorHeader:
      name: X-Actor-Id
      in: header
      required: false
      schema:
        type: string
      description: Local/demo fallback only. QA/prod resolve the actor from the Firebase Auth bearer token.
    TenantIdPath:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
    ModuleCodePath:
      name: module_code
      in: path
      required: true
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        maximum: 200
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Status:
      name: status
      in: query
      required: false
      schema:
        type: string
    Search:
      name: q
      in: query
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CodeSequenceAllocationRead:
      properties:
        document_type:
          type: string
          title: Document Type
        mode:
          type: string
          enum:
          - managed
          - manual
          title: Mode
        code:
          type: string
          title: Code
        sequence_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sequence Number
      type: object
      required:
      - document_type
      - mode
      - code
      title: CodeSequenceAllocationRead
    DocumentPresentationSnapshot:
      type: object
      required: [division_ref_id, division_code, division_name, society_ref_id, society_code, society_name, issuer_ref_id, issuer_code, issuer_legal_name, template_origin, template_origin_id, template]
      properties:
        division_ref_id: { type: string }
        division_code: { type: string }
        division_name: { type: string }
        society_ref_id: { type: string }
        society_code: { type: string }
        society_name: { type: string }
        issuer_ref_id: { type: string }
        issuer_code: { type: string }
        issuer_legal_name: { type: string }
        issuer_tax_id: { type: [string, 'null'] }
        issuer_fiscal_address: { type: [string, 'null'] }
        issuer_postal_code: { type: [string, 'null'] }
        issuer_country_code: { type: [string, 'null'] }
        template_origin: { type: string, enum: [corporate, society, division] }
        template_origin_id: { type: string }
        template: { $ref: '#/components/schemas/DocumentTemplateRead' }
    DocumentTemplateRead:
      properties:
        logo_data_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Logo Data Url
        primary_color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          title: Primary Color
          default: '#6106A0'
        accent_color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          title: Accent Color
          default: '#F557D3'
        text_color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          title: Text Color
          default: '#190F34'
        footer_text:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Footer Text
        show_page_number:
          type: boolean
          title: Show Page Number
          default: true
      type: object
      title: DocumentTemplateRead
    ScopedTemplateCommand:
      properties:
        expected_revision:
