info:
  title: ERClave Admin Service API
  version: 0.1.0
  summary: Tenant, user, role, permission, entitlement and policy APIs.
  description: Initial MVP contract for admin-service. Source of truth for tenants, users, roles, permissions, active modules and tenant settings.
servers:
  - url: https://api.eslaclave.com
    description: Production placeholder
  - url: https://qa-api.eslaclave.com
    description: QA placeholder
security:
  - bearerAuth: []
tags:
  - name: Session
  - name: Tenants
  - name: Backoffice
  - name: Entitlements
  - name: Policy
  - name: Users
  - name: Roles
  - name: BusinessUnits
  - name: Settings
  - name: Catalogs
