          type: string
          enum: [firebase, demo]
        email:
          type: string
        email_sent:
          type: boolean
        reset_link:
          type: [string, 'null']
          description: Present only when backend generated a Firebase reset link instead of sending the Firebase email directly.
        delivery:
          type: string
          enum: [firebase_email, generated_link, disabled, pending]
        error_code:
          type: string
          description: Safe operational code present when the tenant was created but invitation delivery remains pending.
    TenantOnboardingResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TenantOnboardingResult'
