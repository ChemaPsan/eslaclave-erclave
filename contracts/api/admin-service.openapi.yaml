    TenantOnboardingOwnerRequest:
      type: object
      required: [email, display_name]
      properties:
        email:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [invited, active]
          default: invited
        branch_ids:
          type: array
          description: Branch scope for the initial owner. Use `*` for all active branches.
          default: ['*']
          items:
            type: string
    TenantOnboardingModuleRequest:
      type: object
      required: [module_code]
      properties:
        module_code:
          type: string
        status:
          type: string
          enum: [active, inactive, suspended]
          default: active
        limits:
          type: object
          additionalProperties: true
        source:
          type: string
          enum: [subscription, manual, trial, provisioning]
          default: provisioning
    TenantOnboardingRequest:
      type: object
      required: [slug, commercial_name, source, owner]
      properties:
        slug:
          type: string
        commercial_name:
          type: string
        legal_name:
          type: [string, 'null']
        plan_id:
          type: [string, 'null']
        timezone:
          type: string
          default: America/Mexico_City
        locale:
          type: string
          default: es-MX
        source:
          $ref: '#/components/schemas/SourceRef'
        owner:
          $ref: '#/components/schemas/TenantOnboardingOwnerRequest'
        organization_profile:
          $ref: '#/components/schemas/OrganizationProfile'
        modules:
          type: array
          default:
            - module_code: admin
              status: active
              limits: {}
              source: provisioning
          items:
            $ref: '#/components/schemas/TenantOnboardingModuleRequest'
    TenantOnboardingResult:
      type: object
      required: [tenant, owner, entitlements, organization, invitation]
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        owner:
          $ref: '#/components/schemas/User'
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
        organization:
          $ref: '#/components/schemas/Setting'
        session_context:
          oneOf:
            - $ref: '#/components/schemas/SessionContext'
            - type: 'null'
        invitation:
          $ref: '#/components/schemas/TenantOnboardingInvitation'
    TenantOnboardingInvitation:
