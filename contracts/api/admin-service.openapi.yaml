openapi: 3.1.0
info:
  title: ERClave Admin Service API
  version: 0.1.0
  summary: Tenant, user, role, permission, entitlement and policy APIs.
  description: Initial MVP contract for admin-service. Source of truth for tenants, users, roles, permissions, active modules and tenant settings.
servers:
  - url: https://api.eslaclave.com
    description: Production placeholder
  - url: https://qa-api.eslaclave.com
    description: QA placeholder
security:
  - bearerAuth: []
tags:
  - name: Session
  - name: Tenants
  - name: Backoffice
  - name: Entitlements
  - name: Policy
  - name: Users
  - name: Roles
  - name: BusinessUnits
  - name: Settings
paths:
  /v1/session/context:
    get:
      tags: [Session]
      operationId: getSessionContext
      summary: Get current tenant, actor, active modules and granted permissions.
      description: In QA/prod, resolves the actor from a Firebase Auth ID token sent as `Authorization: Bearer <token>`. In local/demo mode, `X-Actor-Id` can be used as a temporary fallback.
      x-required-module: admin
      x-permissions: [internal.session.context.read]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ActorHeader'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current session context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContextResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tenant_id}:
    get:
      tags: [Tenants]
      operationId: getTenant
      summary: Get tenant details.
      x-required-module: admin
      x-permissions: [admin.tenant.read]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Tenant details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tenants]
      operationId: updateTenant
      summary: Update tenant general data.
      x-required-module: admin
      x-permissions: [admin.tenant.update]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
      responses:
        '200':
          description: Tenant updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants:
    post:
      tags: [Tenants]
      operationId: createTenant
      summary: Create tenant from provisioning.
      x-required-module: admin
      x-permissions: [internal.provisioning.tenant.create]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: Tenant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/provisioning/tenant-onboarding:
    post:
      tags: [Tenants]
      operationId: onboardTenant
      summary: Create a tenant, initial owner, modules and organization profile.
      description: Internal provisioning command used by ERClave Backoffice or billing/provisioning. In Firebase mode, the bearer token email must be included in `ERCLAVE_BACKOFFICE_ADMIN_EMAILS`. It creates or updates the tenant by slug, initializes `organization.profile`, creates or links the owner user, assigns the owner role, activates requested modules and records audit trace.
      x-required-module: admin
      x-permissions: [internal.provisioning.tenant.create]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantOnboardingRequest'
      responses:
        '201':
          description: Tenant onboarding completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantOnboardingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/backoffice/usage:
    get:
      tags: [Backoffice]
      operationId: listBackofficeUsage
      summary: List daily tenant usage and estimated costs for internal backoffice.
      description: Internal read endpoint for ERClave Backoffice. In Firebase mode, the bearer token email must be included in `ERCLAVE_BACKOFFICE_ADMIN_EMAILS`.
      x-required-module: admin
      x-permissions: [internal.backoffice.usage.read]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: from_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
            maximum: 500
      responses:
        '200':
          description: Daily usage metrics and range summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackofficeUsageListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/tenants/{tenant_id}/suspend:
    post:
      tags: [Tenants]
      operationId: suspendTenant
      summary: Suspend tenant writes and access according to policy.
      x-required-module: admin
      x-permissions: [admin.tenant.suspend]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Tenant suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/tenants/{tenant_id}/reactivate:
    post:
      tags: [Tenants]
      operationId: reactivateTenant
      summary: Reactivate a suspended tenant.
      x-required-module: admin
      x-permissions: [admin.tenant.reactivate]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Tenant reactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
  /v1/tenants/{tenant_id}/entitlements:
    get:
      tags: [Entitlements]
      operationId: listTenantEntitlements
      summary: List active and inactive modules for a tenant.
      x-required-module: admin
      x-permissions: [internal.entitlement.read]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Tenant entitlements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementListResponse'
  /v1/tenants/{tenant_id}/entitlements/{module_code}:
    put:
      tags: [Entitlements]
      operationId: upsertTenantEntitlement
      summary: Activate, suspend or update limits for a module.
      x-required-module: admin
      x-permissions: [admin.entitlement.manage]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/ModuleCodePath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntitlementUpsertRequest'
      responses:
        '200':
          description: Entitlement updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementResponse'
  /v1/policy/evaluate:
    post:
      tags: [Policy]
      operationId: evaluatePolicy
      summary: Evaluate tenant, module, permission and scope.
      x-required-module: admin
      x-permissions: [internal.policy.evaluate]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyEvaluateRequest'
      responses:
        '200':
          description: Policy decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyEvaluateResponse'
  /v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List tenant users.
      x-required-module: admin
      x-permissions: [admin.user.read]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
  /v1/users/invitations:
    post:
      tags: [Users]
      operationId: inviteUser
      summary: Invite a user without sending password.
      x-required-module: admin
      x-permissions: [admin.user.invite]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInvitationRequest'
      responses:
        '201':
          description: Invitation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /v1/users/{user_id}:
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update user profile or role assignments.
      x-required-module: admin
      x-permissions: [admin.user.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete a tenant user and its identity when no other membership remains.
      x-required-module: admin
      x-permissions: [admin.user.delete]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: User deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /v1/users/{user_id}/disable:
    post:
      tags: [Users]
      operationId: disableUser
      summary: Disable a tenant user.
      x-required-module: admin
      x-permissions: [admin.user.disable]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: User disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /v1/roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: List tenant roles.
      x-required-module: admin
      x-permissions: [admin.role.read]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
    post:
      tags: [Roles]
      operationId: createRole
      summary: Create tenant role.
      x-required-module: admin
      x-permissions: [admin.role.create]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
      responses:
        '201':
          description: Role created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
  /v1/roles/{role_id}:
    patch:
      tags: [Roles]
      operationId: updateRole
      summary: Update role.
      x-required-module: admin
      x-permissions: [admin.role.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: role_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateRequest'
      responses:
        '200':
          description: Role updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
  /v1/roles/{role_id}/permissions:
    put:
      tags: [Roles]
      operationId: replaceRolePermissions
      summary: Replace permissions for a role.
      x-required-module: admin
      x-permissions: [admin.role.permissions.manage]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: role_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionsReplaceRequest'
      responses:
        '200':
          description: Permissions replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '403':
          description: Permission, module entitlement or owner invariant forbids the assignment.
        '409':
          description: Revision conflict or Idempotency-Key reused with another payload.
        '422':
          description: Invalid assignment, duplicate permission or unsupported scope change.
  /v1/permissions:
    get:
      tags: [Roles]
      operationId: listPermissions
      summary: List active permission catalog.
      x-required-module: admin
      x-permissions: [admin.role.read]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'
  /v1/business-units:
    get:
      tags: [BusinessUnits]
      operationId: listBusinessUnits
      summary: List business units.
      x-required-module: admin
      x-permissions: [admin.business_unit.read]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Business units.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessUnitListResponse'
    post:
      tags: [BusinessUnits]
      operationId: createBusinessUnit
      summary: Create business unit.
      x-required-module: admin
      x-permissions: [admin.business_unit.create]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessUnitCreateRequest'
      responses:
        '201':
          description: Business unit created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessUnitResponse'
  /v1/settings:
    get:
      tags: [Settings]
      operationId: listSettings
      summary: List tenant settings.
      x-required-module: admin
      x-permissions: [admin.setting.read]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - name: module_code
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingListResponse'
  /v1/settings/{key}:
    put:
      tags: [Settings]
      operationId: upsertSetting
      summary: Upsert tenant setting.
      x-required-module: admin
      x-permissions: [admin.setting.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: key
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingUpsertRequest'
      responses:
        '200':
          description: Setting upserted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingResponse'
  /v1/organization/legal-entities:
    post:
      tags: [Settings]
      operationId: createLegalEntity
      summary: Create legal entity inside organization profile.
      x-required-module: admin
      x-permissions: [admin.setting.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalEntityCreateRequest'
      responses:
        '201':
          description: Legal entity created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationItemResponse'
  /v1/organization/legal-entities/{legal_entity_id}:
    patch:
      tags: [Settings]
      operationId: updateLegalEntity
      summary: Update legal entity inside organization profile.
      x-required-module: admin
      x-permissions: [admin.setting.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: legal_entity_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalEntityUpdateRequest'
      responses:
        '200':
          description: Legal entity updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationItemResponse'
  /v1/organization/legal-entities/{legal_entity_id}/activate:
    post:
      tags: [Settings]
      operationId: activateLegalEntity
      summary: Activate legal entity.
      x-required-module: admin
      x-permissions: [admin.setting.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: legal_entity_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Legal entity activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationItemResponse'
  /v1/organization/legal-entities/{legal_entity_id}/deactivate:
    post:
      tags: [Settings]
      operationId: deactivateLegalEntity
      summary: Deactivate legal entity.
      x-required-module: admin
      x-permissions: [admin.setting.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: legal_entity_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Legal entity deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationItemResponse'
  /v1/organization/branches:
    post:
      tags: [Settings]
      operationId: createBranch
      summary: Create branch inside organization profile.
      x-required-module: admin
      x-permissions: [admin.setting.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreateRequest'
      responses:
        '201':
          description: Branch created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationItemResponse'
  /v1/organization/branches/{branch_id}:
    patch:
      tags: [Settings]
      operationId: updateBranch
      summary: Update branch inside organization profile.
      x-required-module: admin
      x-permissions: [admin.setting.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: branch_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchUpdateRequest'
      responses:
        '200':
          description: Branch updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationItemResponse'
  /v1/organization/branches/{branch_id}/activate:
    post:
      tags: [Settings]
      operationId: activateBranch
      summary: Activate branch.
      x-required-module: admin
      x-permissions: [admin.setting.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: branch_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Branch activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationItemResponse'
  /v1/organization/branches/{branch_id}/deactivate:
    post:
      tags: [Settings]
      operationId: deactivateBranch
      summary: Deactivate branch.
      x-required-module: admin
      x-permissions: [admin.setting.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: branch_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Branch deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationItemResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
      description: Tenant context. Must match authenticated actor.
    ActorHeader:
      name: X-Actor-Id
      in: header
      required: false
      schema:
        type: string
      description: Local/demo fallback only. QA/prod resolve the actor from the Firebase Auth bearer token.
    TenantIdPath:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
    ModuleCodePath:
      name: module_code
      in: path
      required: true
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        maximum: 200
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Status:
      name: status
      in: query
      required: false
      schema:
        type: string
    Search:
      name: q
      in: query
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlation_id]
          properties:
            code:
              type: string
            message:
              type: string
            correlation_id:
              type: string
            details:
              type: object
              additionalProperties: true
    Page:
      type: object
      properties:
        limit:
          type: integer
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
    Tenant:
      type: object
      required: [id, slug, commercial_name, status]
      properties:
        id:
          type: string
        slug:
          type: string
        legal_name:
          type: [string, 'null']
        commercial_name:
          type: string
        status:
          type: string
          enum: [provisioning, active, suspended, cancelled]
        plan_id:
          type: [string, 'null']
        timezone:
          type: string
        locale:
          type: string
    TenantResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Tenant'
    TenantCreateRequest:
      type: object
      required: [slug, commercial_name, source]
      properties:
        slug:
          type: string
        commercial_name:
          type: string
        legal_name:
          type: string
        plan_id:
          type: string
        timezone:
          type: string
          default: America/Mexico_City
        locale:
          type: string
          default: es-MX
        source:
          $ref: '#/components/schemas/SourceRef'
        organization_profile:
          $ref: '#/components/schemas/OrganizationProfile'
          description: Initial tenant organization profile. If omitted, admin-service/provisioning must create an empty `organization.profile` setting.
    TenantOnboardingOwnerRequest:
      type: object
      required: [email, display_name]
      properties:
        email:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [invited, active]
          default: invited
        branch_ids:
          type: array
          description: Branch scope for the initial owner. Use `*` for all active branches.
          default: ['*']
          items:
            type: string
    TenantOnboardingModuleRequest:
      type: object
      required: [module_code]
      properties:
        module_code:
          type: string
        status:
          type: string
          enum: [active, inactive, suspended]
          default: active
        limits:
          type: object
          additionalProperties: true
        source:
          type: string
          enum: [subscription, manual, trial, provisioning]
          default: provisioning
    TenantOnboardingRequest:
      type: object
      required: [slug, commercial_name, source, owner]
      properties:
        slug:
          type: string
        commercial_name:
          type: string
        legal_name:
          type: [string, 'null']
        plan_id:
          type: [string, 'null']
        timezone:
          type: string
          default: America/Mexico_City
        locale:
          type: string
          default: es-MX
        source:
          $ref: '#/components/schemas/SourceRef'
        owner:
          $ref: '#/components/schemas/TenantOnboardingOwnerRequest'
        organization_profile:
          $ref: '#/components/schemas/OrganizationProfile'
        modules:
          type: array
          default:
            - module_code: admin
              status: active
              limits: {}
              source: provisioning
          items:
            $ref: '#/components/schemas/TenantOnboardingModuleRequest'
    TenantOnboardingResult:
      type: object
      required: [tenant, owner, entitlements, organization, invitation]
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        owner:
          $ref: '#/components/schemas/User'
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
        organization:
          $ref: '#/components/schemas/Setting'
        session_context:
          oneOf:
            - $ref: '#/components/schemas/SessionContext'
            - type: 'null'
        invitation:
          $ref: '#/components/schemas/TenantOnboardingInvitation'
    TenantOnboardingInvitation:
      type: object
      required: [provider, email, email_sent, delivery]
      properties:
        provider:
          type: string
          enum: [firebase, demo]
        email:
          type: string
        email_sent:
          type: boolean
        reset_link:
          type: [string, 'null']
          description: Present only when backend generated a Firebase reset link instead of sending the Firebase email directly.
        delivery:
          type: string
          enum: [firebase_email, generated_link, disabled]
    TenantOnboardingResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TenantOnboardingResult'
    BackofficeUsageDaily:
      type: object
      required: [tenant_id, tenant_slug, tenant_name, usage_date, active_users, api_requests, storage_mb, estimated_cost_mxn]
      properties:
        tenant_id:
          type: string
        tenant_slug:
          type: string
        tenant_name:
          type: string
        usage_date:
          type: string
          format: date
        active_users:
          type: integer
          minimum: 0
        api_requests:
          type: integer
          minimum: 0
        storage_mb:
          type: number
          minimum: 0
        estimated_cost_mxn:
          type: number
          minimum: 0
        source:
          type: [string, 'null']
    BackofficeUsageSummary:
      type: object
      required: [tenants, days, active_users, api_requests, storage_mb, estimated_cost_mxn]
      properties:
        tenants:
          type: integer
          minimum: 0
        days:
          type: integer
          minimum: 0
        active_users:
          type: integer
          minimum: 0
        api_requests:
          type: integer
          minimum: 0
        storage_mb:
          type: number
          minimum: 0
        estimated_cost_mxn:
          type: number
          minimum: 0
    BackofficeUsageListResponse:
      type: object
      required: [data, summary]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BackofficeUsageDaily'
        summary:
          $ref: '#/components/schemas/BackofficeUsageSummary'
    TenantUpdateRequest:
      type: object
      properties:
        commercial_name:
          type: string
        legal_name:
          type: string
        timezone:
          type: string
        locale:
          type: string
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
    SourceRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
        id:
          type: string
    Entitlement:
      type: object
      properties:
        module_code:
          type: string
        status:
          type: string
          enum: [active, inactive, suspended]
        limits:
          type: object
          additionalProperties: true
    EntitlementResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Entitlement'
    EntitlementListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
    SessionContext:
      type: object
      required: [tenant, user, roles, entitlements, entitlement_limits, permissions, active_modules, scope]
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        user:
          $ref: '#/components/schemas/User'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
        entitlement_limits:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
        permissions:
          type: array
          items:
            type: string
        active_modules:
          type: array
          items:
            type: string
        scope:
          $ref: '#/components/schemas/SessionScope'
    SessionBranch:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        status:
          type: string
        legal_entity_id:
          type: string
    SessionScope:
      type: object
      required: [branch_ids, branches, all_branches]
      properties:
        branch_ids:
          type: array
          items:
            type: string
        branches:
          type: array
          items:
            $ref: '#/components/schemas/SessionBranch'
        all_branches:
          type: boolean
    SessionContextResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SessionContext'
    EntitlementUpsertRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, inactive, suspended]
        limits:
          type: object
          additionalProperties: true
        source:
          type: string
          enum: [subscription, manual, trial]
    PolicyEvaluateRequest:
      type: object
      required: [tenant_id, actor_id, module, resource, action]
      properties:
        tenant_id:
          type: string
        actor_id:
          type: string
        module:
          type: string
        resource:
          type: string
        action:
          type: string
        scope:
          type: object
          additionalProperties: true
    PolicyEvaluateResponse:
      type: object
      properties:
        data:
          type: object
          required: [allowed]
          properties:
            allowed:
              type: boolean
            reason:
              type: string
            matched_permissions:
              type: array
              items:
                type: string
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [invited, active, disabled, deleted]
        roles:
          type: array
          items:
            type: string
    UserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'
    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/Page'
    UserInvitationRequest:
      type: object
      required: [email, display_name, role_ids]
      properties:
        email:
          type: string
        display_name:
          type: string
        role_ids:
          type: array
          items:
            type: string
    UserUpdateRequest:
      type: object
      properties:
        display_name:
          type: string
        role_ids:
          type: array
          items:
            type: string
    Role:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        status:
          type: string
        permissions:
          type: array
          items:
            type: string
        permission_assignments:
          type: array
          items:
            $ref: '#/components/schemas/PermissionAssignment'
        system_role:
          type: boolean
        permission_revision:
          type: integer
          minimum: 1
    RoleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Role'
    RoleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        page:
          $ref: '#/components/schemas/Page'
    RoleCreateRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
    RoleUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
    RolePermissionsReplaceRequest:
      type: object
      properties:
        assignments:
          type: array
          description: Preferred representation. Requires expected_revision.
          items:
            $ref: '#/components/schemas/PermissionAssignmentInput'
        expected_revision:
          type: integer
          minimum: 1
        permission_ids:
          type: array
          deprecated: true
          description: Legacy representation retained for compatible clients; cannot be combined with assignments.
          items:
            type: string
        scope:
          type: object
          deprecated: true
          description: Legacy shared scope used only with permission_ids.
          additionalProperties: true
    PermissionAssignmentInput:
      type: object
      required: [permission_id]
      properties:
        permission_id:
          type: string
        scope:
          type: object
          description: Opaque existing scope must be sent unchanged; new assignments currently require an empty object.
          additionalProperties: true
    PermissionAssignment:
      allOf:
        - $ref: '#/components/schemas/PermissionAssignmentInput'
        - type: object
          required: [code]
          properties:
            code:
              type: string
    Permission:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        module_code:
          type: string
        resource:
          type: string
        action:
          type: string
        status:
          type: string
        display_name_es:
          type: string
        display_name_en:
          type: string
        description_es:
          type: string
        description_en:
          type: string
        classification:
          type: string
          enum: [tenant, internal, public, integration]
        assignable_to_tenant_role:
          type: boolean
        risk_level:
          type: string
          enum: [low, standard, high, critical]
        sort_order:
          type: integer
        entitlement_status:
          type: string
          nullable: true
          enum: [active, inactive, suspended]
        available:
          type: boolean
    PermissionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        page:
          $ref: '#/components/schemas/Page'
    BusinessUnit:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        status:
          type: string
    BusinessUnitResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BusinessUnit'
    BusinessUnitListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BusinessUnit'
    BusinessUnitCreateRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    Setting:
      type: object
      description: Tenant setting. `organization.profile` is the canonical key for corporate, legal entities and branches configured in Administration.
      properties:
        key:
          type: string
        module_code:
          type: string
        value:
          type: object
          additionalProperties: true
    SettingResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Setting'
    SettingListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Setting'
    SettingUpsertRequest:
      type: object
      required: [value]
      properties:
        module_code:
          type: string
        value:
          type: object
          additionalProperties: true
          description: For key `organization.profile`, this value must match `OrganizationProfile`.
    OrganizationItemResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
    LegalEntityCreateRequest:
      type: object
      required: [legal_name]
      properties:
        legal_name:
          type: string
        tax_id:
          type: string
        fiscal_regime:
          type: string
        cfdi_usage:
          type: string
        fiscal_address:
          type: string
        contact_name:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
        contact_position:
          type: string
    LegalEntityUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/LegalEntityCreateRequest'
      required: []
    BranchCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        code:
          type: string
        legal_entity_id:
          type: string
        address:
          type: string
        phone:
          type: string
    BranchUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/BranchCreateRequest'
      required: []
    OrganizationProfile:
      type: object
      required: [corporate, legal_entities, branches]
      properties:
        corporate:
          $ref: '#/components/schemas/CorporateProfile'
        legal_entities:
          type: array
          items:
            $ref: '#/components/schemas/LegalEntityProfile'
        branches:
          type: array
          items:
            $ref: '#/components/schemas/BranchProfile'
    CorporateProfile:
      type: object
      required: [commercial_name]
      properties:
        commercial_name:
          type: string
        legal_name:
          type: string
        tax_id:
          type: string
        phone:
          type: string
        contact_name:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
        contact_position:
          type: string
    LegalEntityProfile:
      type: object
      required: [id, legal_name]
      properties:
        id:
          type: string
        legal_name:
          type: string
        tax_id:
          type: string
        fiscal_regime:
          type: string
        cfdi_usage:
          type: string
        fiscal_address:
          type: string
        contact_name:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
        contact_position:
          type: string
    BranchProfile:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        legal_entity_id:
          type: string
        address:
          type: string
        phone:
          type: string
