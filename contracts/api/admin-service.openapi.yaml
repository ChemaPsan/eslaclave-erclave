openapi: 3.1.0
info:
  title: ERClave Admin Service API
  version: 0.1.0
  summary: Tenant, user, role, permission, entitlement and policy APIs.
  description: Initial MVP contract for admin-service. Source of truth for tenants, users, roles, permissions, active modules and tenant settings.
servers:
  - url: https://api.eslaclave.com
    description: Production placeholder
  - url: https://qa-api.eslaclave.com
    description: QA placeholder
security:
  - bearerAuth: []
tags:
  - name: Session
  - name: Tenants
  - name: Backoffice
  - name: Entitlements
  - name: Policy
  - name: Users
  - name: Roles
  - name: BusinessUnits
  - name: Settings
  - name: Catalogs
paths:
  /v1/session/context:
    get:
      tags: [Session]
      operationId: getSessionContext
      summary: Get current tenant, actor, active modules and granted permissions.
      description: "In QA/prod, resolves the actor from a Firebase Auth ID token sent as `Authorization: Bearer <token>`. In local/demo mode, `X-Actor-Id` can be used as a temporary fallback."
      x-required-module: admin
      x-permissions: [internal.session.context.read]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ActorHeader'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current session context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContextResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/session/tenants:
    get:
      tags: [Session]
      operationId: listSessionTenants
      summary: List tenants available to the authenticated Firebase actor.
      x-required-module: admin
      x-permissions: [internal.session.tenant.read]
      responses:
        '200':
          description: Available tenant memberships.
          content: {application/json: {schema: {$ref: '#/components/schemas/SessionTenantListResponse'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/tenants/{tenant_id}:
    get:
      tags: [Tenants]
      operationId: getTenant
      summary: Get tenant details.
      x-required-module: admin
      x-permissions: [admin.tenant.read]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Tenant details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tenants]
      operationId: updateTenant
      summary: Update tenant general data.
      x-required-module: admin
      x-permissions: [admin.tenant.update]
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
      responses:
        '200':
          description: Tenant updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants:
    post:
      tags: [Tenants]
      operationId: createTenant
      summary: Create tenant from provisioning.
      x-required-module: admin
      x-permissions: [internal.provisioning.tenant.create]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: Tenant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/provisioning/tenant-onboarding:
    post:
      tags: [Tenants]
      operationId: onboardTenant
      summary: Create a tenant, initial owner, modules and organization profile.
      description: Internal provisioning command used by ERClave Backoffice or billing/provisioning. In Firebase mode, the bearer token email must be included in `ERCLAVE_BACKOFFICE_ADMIN_EMAILS`. It creates or updates the tenant by slug, initializes `organization.profile`, creates or links the owner user, assigns the owner role, activates requested modules and records audit trace.
      x-required-module: admin
      x-permissions: [internal.provisioning.tenant.create]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantOnboardingRequest'
      responses:
        '201':
          description: Tenant onboarding completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantOnboardingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          description: Firebase identity lifecycle is unavailable or not authorized before tenant persistence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/backoffice/usage:
    get:
      tags: [Backoffice]
      operationId: listBackofficeUsage
      summary: List daily tenant usage and estimated costs for internal backoffice.
      description: Internal read endpoint for ERClave Backoffice. In Firebase mode, the bearer token email must be included in `ERCLAVE_BACKOFFICE_ADMIN_EMAILS`.
      x-required-module: admin
      x-permissions: [internal.backoffice.usage.read]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: from_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
            maximum: 500
      responses:
        '200':
          description: Daily usage metrics and range summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackofficeUsageListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/backoffice/tenants:
    get:
      tags: [Backoffice]
      operationId: listBackofficeTenants
      summary: List tenants for the internal ERClave backoffice.
      x-required-module: admin
      x-permissions: [internal.backoffice.tenant.read]
      parameters:
        - name: search
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, default: 50, minimum: 1, maximum: 100}
      responses:
        '200':
          description: Tenant list.
          content: {application/json: {schema: {$ref: '#/components/schemas/BackofficeTenantListResponse'}}}
  /v1/backoffice/modules:
    get:
      tags: [Backoffice]
      operationId: listBackofficeModules
      summary: List the ERClave module catalog and implementation availability.
      x-required-module: admin
      x-permissions: [internal.backoffice.tenant.read]
      responses:
        '200':
          description: Module catalog.
          content: {application/json: {schema: {$ref: '#/components/schemas/ModuleCatalogListResponse'}}}
  /v1/backoffice/tenants/{tenant_id}/status:
    patch:
      tags: [Backoffice]
      operationId: setBackofficeTenantStatus
      summary: Activate or suspend a tenant from internal backoffice.
      x-required-module: admin
      x-permissions: [internal.backoffice.tenant.manage]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BackofficeTenantStatusRequest'}}}
      responses:
        '200':
          description: Tenant status updated.
          content: {application/json: {schema: {$ref: '#/components/schemas/TenantResponse'}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/backoffice/tenants/{tenant_id}:
    patch:
      tags: [Backoffice]
      operationId: updateBackofficeTenant
      summary: Update editable tenant identity and localization fields.
      x-required-module: admin
      x-permissions: [internal.backoffice.tenant.manage]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BackofficeTenantUpdateRequest'}}}
      responses:
        '200':
          description: Tenant updated.
          content: {application/json: {schema: {$ref: '#/components/schemas/TenantResponse'}}}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Backoffice]
      operationId: deleteBackofficeTenant
      summary: Permanently remove a tenant through the protected internal backoffice.
      x-required-module: admin
      x-permissions: [internal.backoffice.tenant.delete]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Tenant deletion result. Firebase identity cleanup is reported independently as completed or pending.
          content: {application/json: {schema: {$ref: '#/components/schemas/BackofficeTenantDeleteResponse'}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/backoffice/tenants/{tenant_id}/entitlements/{module_code}:
    put:
      tags: [Backoffice]
      operationId: setBackofficeTenantEntitlement
      summary: Grant, suspend or withdraw a tenant module entitlement from internal Backoffice.
      x-required-module: admin
      x-permissions: [internal.backoffice.entitlement.manage]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/ModuleCodePath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BackofficeEntitlementUpdateRequest'}}}
      responses:
        '200':
          description: Contractual entitlement updated.
          content: {application/json: {schema: {$ref: '#/components/schemas/EntitlementResponse'}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/tenants/{tenant_id}/suspend:
    post:
      tags: [Tenants]
      operationId: suspendTenant
      summary: Suspend tenant writes and access according to policy.
      x-required-module: admin
      x-permissions: [admin.tenant.suspend]
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Tenant suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/tenants/{tenant_id}/reactivate:
    post:
      tags: [Tenants]
      operationId: reactivateTenant
      summary: Reactivate a suspended tenant.
      x-required-module: admin
      x-permissions: [admin.tenant.reactivate]
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Tenant reactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
  /v1/tenants/{tenant_id}/entitlements:
    get:
      tags: [Entitlements]
      operationId: listTenantEntitlements
      summary: List active and inactive modules for a tenant.
      x-required-module: admin
      x-permissions: [admin.tenant.read]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Tenant entitlements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementListResponse'
  /v1/tenants/{tenant_id}/entitlements/{module_code}:
    put:
      tags: [Entitlements]
      operationId: upsertTenantEntitlement
      summary: Turn on or off a module already granted by Backoffice.
      x-required-module: admin
      x-permissions: [admin.entitlement.manage]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/ModuleCodePath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntitlementPreferenceUpdateRequest'
      responses:
        '200':
          description: Entitlement updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementResponse'
  /v1/policy/evaluate:
    post:
      tags: [Policy]
      operationId: evaluatePolicy
      summary: Evaluate tenant, module, permission and scope.
      x-required-module: admin
      x-permissions: [internal.policy.evaluate]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyEvaluateRequest'
      responses:
        '200':
          description: Policy decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyEvaluateResponse'
  /v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List tenant users.
      x-required-module: admin
      x-permissions: [admin.user.read]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
  /v1/users/invitations:
    post:
      tags: [Users]
      operationId: inviteUser
      summary: Invite a user without sending password.
      x-required-module: admin
      x-permissions: [admin.user.invite]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInvitationRequest'
      responses:
        '201':
          description: Invitation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /v1/users/{user_id}:
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update user profile or role assignments.
      x-required-module: admin
      x-permissions: [admin.user.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete a tenant user and its identity when no other membership remains.
      x-required-module: admin
      x-permissions: [admin.user.delete]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: User deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /v1/users/{user_id}/disable:
    post:
      tags: [Users]
      operationId: disableUser
      summary: Disable a tenant user.
      x-required-module: admin
      x-permissions: [admin.user.disable]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: User disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /v1/roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: List tenant roles.
      x-required-module: admin
      x-permissions: [admin.role.read]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
    post:
      tags: [Roles]
      operationId: createRole
      summary: Create tenant role.
      x-required-module: admin
      x-permissions: [admin.role.create]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
      responses:
        '201':
          description: Role created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
  /v1/roles/{role_id}:
    patch:
      tags: [Roles]
      operationId: updateRole
      summary: Update role.
      x-required-module: admin
      x-permissions: [admin.role.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: role_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateRequest'
      responses:
        '200':
          description: Role updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
  /v1/roles/{role_id}/permissions:
    put:
      tags: [Roles]
      operationId: replaceRolePermissions
      summary: Replace permissions for a role.
      x-required-module: admin
      x-permissions: [admin.role.permissions.manage]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: role_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionsReplaceRequest'
      responses:
        '200':
          description: Permissions replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '403':
          description: Permission, module entitlement or owner invariant forbids the assignment.
        '409':
          description: Revision conflict or Idempotency-Key reused with another payload.
        '422':
          description: Invalid assignment, duplicate permission or unsupported scope change.
  /v1/permissions:
    get:
      tags: [Roles]
      operationId: listPermissions
      summary: List active permission catalog.
      x-required-module: admin
      x-permissions: [admin.role.read]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'
  /v1/business-units:
    get:
      tags: [BusinessUnits]
      operationId: listBusinessUnits
      summary: List business units.
      x-required-module: admin
      x-permissions: [admin.business_unit.read]
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Business units.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessUnitListResponse'
    post:
      tags: [BusinessUnits]
      operationId: createBusinessUnit
      summary: Create business unit.
      x-required-module: admin
      x-permissions: [admin.business_unit.create]
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessUnitCreateRequest'
      responses:
        '201':
          description: Business unit created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessUnitResponse'
  /v1/settings:
    get:
      tags: [Settings]
      operationId: listSettings
      summary: List tenant settings.
      x-required-module: admin
      x-permissions: [admin.setting.read]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - name: module_code
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingListResponse'
  /v1/settings/{key}:
    put:
      tags: [Settings]
      operationId: upsertSetting
      summary: Upsert tenant setting.
      x-required-module: admin
      x-permissions: [admin.setting.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: key
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingUpsertRequest'
      responses:
        '200':
          description: Setting upserted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingResponse'
  /v1/organization/legal-entities:
    post:
      tags: [Settings]
      operationId: createLegalEntity
      summary: Create legal entity inside organization profile.
      x-required-module: admin
      x-permissions: [admin.setting.update]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalEntityCreateRequest'
      responses:
        '201':
