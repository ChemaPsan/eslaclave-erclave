        legal_name:
          type: [string, 'null']
        commercial_name:
          type: string
        status:
          type: string
          enum: [provisioning, active, suspended, cancelled]
        plan_id:
          type: [string, 'null']
        timezone:
          type: string
        locale:
          type: string
    TenantResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Tenant'
    TenantCreateRequest:
      type: object
      required: [slug, commercial_name, source]
      properties:
        slug:
          type: string
        commercial_name:
          type: string
        legal_name:
          type: string
        plan_id:
          type: string
        timezone:
          type: string
          default: America/Mexico_City
        locale:
          type: string
          default: es-MX
        source:
          $ref: '#/components/schemas/SourceRef'
