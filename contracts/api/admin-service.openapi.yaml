      operationId: allocate_cost_center_code_v1_cost_center_codes_next_post
      parameters:
      - name: X-Tenant-Id
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant-Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Idempotency-Key
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: X-Correlation-Id
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSequenceAllocationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          description: Missing key, access denied or inactive/non-managed numbering.
        '401':
          description: Missing key, access denied or inactive/non-managed numbering.
        '403':
          description: Missing key, access denied or inactive/non-managed numbering.
        '409':
          description: Missing key, access denied or inactive/non-managed numbering.
