name: Validate repo rules

on:
  pull_request:
    branches:
      - main
    paths:
      - ".agents/**"
      - "AGENTS.md"
      - "AGENTES.md"
      - "README.md"
      - "TRAZABILIDAD.md"
      - "backend/**"
      - "contracts/**"
      - "docs/**"
      - "frontend/**"
      - "modulos/**"
      - "package.json"
      - "tools/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/qa-candidate.yml"
      - ".github/workflows/qa-release.yml"
      - ".github/workflows/qa-admin-backoffice-config.yml"
  push:
    branches:
      - main
    paths:
      - ".agents/**"
      - "AGENTS.md"
      - "AGENTES.md"
      - "README.md"
      - "TRAZABILIDAD.md"
      - "backend/**"
      - "contracts/**"
      - "docs/**"
      - "frontend/**"
      - "modulos/**"
      - "package.json"
      - "tools/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/qa-candidate.yml"
      - ".github/workflows/qa-release.yml"
      - ".github/workflows/qa-admin-backoffice-config.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    name: Complete repository verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Run complete verification
        run: npm run verify
