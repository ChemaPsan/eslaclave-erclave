name: Validate repo rules

on:
  pull_request:
    branches:
      - main
    paths:
      - "AGENTES.md"
      - "README.md"
      - "TRAZABILIDAD.md"
      - "backend/**"
      - "contracts/**"
      - "docs/**"
      - "frontend/**"
      - "modulos/**"
      - "package.json"
      - "tools/**"
      - ".github/workflows/validate.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTES.md"
      - "README.md"
      - "TRAZABILIDAD.md"
      - "backend/**"
      - "contracts/**"
      - "docs/**"
      - "frontend/**"
      - "modulos/**"
      - "package.json"
      - "tools/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Agent rule validators
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run validators
        run: npm run validate
