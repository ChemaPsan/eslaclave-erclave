name: Validate repo rules

on:
  pull_request:
    branches:
      - main
    paths:
      - "AGENTES.md"
      - "README.md"
      - "TRAZABILIDAD.md"
      - "backend/**"
      - "contracts/**"
      - "docs/**"
      - "frontend/**"
      - "modulos/**"
      - "package.json"
      - "tools/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTES.md"
      - "README.md"
      - "TRAZABILIDAD.md"
      - "backend/**"
      - "contracts/**"
      - "docs/**"
      - "frontend/**"
      - "modulos/**"
      - "package.json"
      - "tools/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validators:
    name: Agent rule validators
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run validators
        run: npm run validate

  backend-tests:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run backend tests
        run: python -m pytest -q
