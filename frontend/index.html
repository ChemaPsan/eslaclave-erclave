<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERClave | Propuesta Frontend</title>
    <link rel="stylesheet" href="./styles.css?v=20260825-chg245-compact-header" />
  </head>
  <body>
    <a class="skip-link" href="#mainWorkspace">Saltar al contenido principal</a>
    <div class="app-shell" data-theme="light">
      <aside class="sidebar" aria-label="Navegacion principal">
        <div class="brand-block">
          <div class="brand-mark">ER</div>
          <div>
            <strong>ERClave</strong>
            <span>Operacion modular</span>
          </div>
        </div>

        <nav class="module-nav" id="moduleNav" aria-label="Modulos y submodulos"></nav>

        <div class="sidebar-footer">
          <button class="icon-button" id="themeToggle" type="button" aria-label="Cambiar tema" title="Cambiar tema">
            <span class="icon">◐</span>
          </button>
          <button class="icon-button" id="langToggle" type="button" aria-label="Cambiar idioma" title="Cambiar idioma">
            <span class="icon">ES</span>
          </button>
          <button class="icon-button" id="adminShortcut" type="button" aria-label="Administracion" title="Administracion">
            <span class="icon">⚙</span>
          </button>
        </div>
      </aside>

      <main class="workspace" id="mainWorkspace" tabindex="-1">
        <header class="topbar">
          <div class="topbar-title">
            <button class="back-button" id="backButton" type="button" aria-label="Volver a la pantalla anterior" title="Volver" disabled>
              <span>&lt;</span>
            </button>
          </div>
          <section class="context-bar" aria-label="Contexto de sesion">
            <div class="context-pill">
              <span class="context-label">Usuario</span>
              <strong id="contextUser">Sin sesion</strong>
            </div>
            <div class="context-pill branch-context" id="branchContext">
              <span class="context-label">Sucursal</span>
              <strong id="contextBranch">Matriz</strong>
            </div>
            <button class="context-logout" id="authButton" type="button" hidden>Cerrar sesion</button>
          </section>
          <div class="topbar-actions">
            <label class="search-field">
              <span>⌕</span>
              <input id="searchInput" type="search" placeholder="Buscar orden, producto, cliente" data-i18n-placeholder="search" />
            </label>
            <button class="primary-action" type="button">
              <span>＋</span>
              <span data-i18n="newOrder">Nueva orden</span>
            </button>
          </div>
        </header>

        <section class="content-grid">
          <section class="main-panel" id="modulePanel"></section>

          <aside class="insight-panel">
            <section class="status-strip" aria-label="Indicadores principales"></section>
            <div class="panel-head">
              <div>
                <h2 data-i18n="alertsTitle">Alertas operativas</h2>
              </div>
            </div>

            <div class="flow-list" id="flowList"></div>

            <div class="validation-card" id="notificationSummary"></div>
          </aside>
        </section>
      </main>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div id="modalContent"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    <div class="auth-gate" id="authGate" hidden></div>

    <script src="./env.js"></script>
    <script type="module" src="./app.js?v=20260825-chg247-maintenance-time"></script>
  </body>
</html>
